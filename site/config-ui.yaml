environments:
  - description: "LLM Proxy"
    origins:
      - "https://llm-proxy.mprlab.com"
      - "http://127.0.0.1:4179"
      - "http://localhost:4179"
    auth:
      tauthUrl: "https://tauth-api.mprlab.com"
      tenantId: "llm-proxy"
      logoutPath: "/auth/logout"
      sessionPath: "/auth/session"
      providers:
        google:
          enabled: true
          clientId: "925457785190-3frk7j3bsr3ucidtkcohrp2sl07e0paa.apps.googleusercontent.com"
          loginPath: "/auth/google"
          noncePath: "/auth/nonce"
        apple:
          enabled: false
        password:
          enabled: false
