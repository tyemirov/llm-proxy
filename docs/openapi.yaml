openapi: 3.1.0
info:
  title: LLM Proxy HTTP API
  version: 1.0.0
  description: >-
    The sole canonical wire contract for llm-proxy-owned proxy, browser
    configuration, and management endpoints. Each configured text model owns
    one explicit upstream wire contract and execution lifecycle. OpenAI
    Gemini 3.5 Transcribe accepts file dictation through synchronous Interactions.
    The filename extension selects a supported audio MIME type. An unsupported
    extension returns HTTP 400 with invalid_audio_input. The upload byte limit
    applies. Gemini enforces its one-hour audio duration limit.
    Gemini 3.6 Flash accepts reasoning efforts minimal, low, medium, and high.
    Gemini 3.7 Flash accepts low, medium, and high. An omitted effort leaves
    the provider default in effect. Both routes accept text, image, and audio
    input with a maximum of 65,536 output tokens.
    Responses and Gemini 3.x Interactions use stored pollable resources.
    OpenAI-compatible Chat Completions and Anthropic Messages complete
    synchronously. Generation responses remain synchronous. A hosted duplicate
    can return an active receipt. The proxy does not expose provider resource identifiers.
    For customer-owned credentials, OpenAI resource ids remain in memory only.
    The adapter does not cancel or delete stored Responses. The OpenAI account retention policy applies.
    For hosted work, the journal keeps private provider resource identifiers.
    For customer-owned credentials, background Gemini interaction ids are request-local.
    The adapter cancels active resources and deletes every stored interaction on exit.
    Each Gemini Interactions route rejects
    assistant history before provider dispatch. An incomplete Gemini response
    returns a provider error without replay.
    TAuth-owned endpoints are outside this contract.
    Contributors must update this document in the same change as any owned
    handler or bundled-client wire change.
servers:
  - url: https://llm-proxy-api.mprlab.com
    description: Production API origin
x-llm-proxy-protocol-methods:
  - OPTIONS
tags:
  - name: Client protocols
    description: Tenant bearer interfaces for OpenAI clients and OpenCode.
  - name: Proxy
    description: Tenant-key-authenticated text and dictation operations.
  - name: Configuration
    description: Public browser runtime configuration owned by llm-proxy.
  - name: Capabilities
    description: Public provider, model, capability, and request-limit resources.
  - name: Management
    description: TAuth-session-authenticated tenant management operations.
paths:
  /.well-known/oauth-protected-resource/mcp:
    get:
      operationId: getMCPResourceMetadata
      summary: Read OAuth metadata for the MCP resource.
      security: []
      responses:
        '200':
          description: The metadata identifies the TAuth issuer and required scope.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [resource, authorization_servers, scopes_supported, bearer_methods_supported]
                properties:
                  resource:
                    type: string
                    format: uri
                  authorization_servers:
                    type: array
                    items:
                      type: string
                      format: uri
                  scopes_supported:
                    type: array
                    items:
                      type: string
                      const: llm-proxy:use
                  bearer_methods_supported:
                    type: array
                    items:
                      type: string
                      const: header
  /mcp:
    post:
      operationId: postMCPRequest
      summary: Use an owned tenant through MCP.
      description: >-
        Stateless Streamable HTTP supports 2026-07-28, 2025-11-25, 2025-06-18, and 2025-03-26 with JSON responses.
        The 2025 revisions use initialize and notifications/initialized.
        The 2026 revision uses server/discover and per-request protocol metadata.
        TAuth issues tokens for the API origin with the llm-proxy:use scope.
        Each request requires a bearer token.
        The body must arrive within server.request_timeout_seconds and cannot exceed 8 MiB.
        An upload timeout returns HTTP 408 before tool execution.
        Generation uses a separate request_timeout_seconds budget after the upload.
        The llm_proxy.list_tenants tool provides all owned tenant summaries.
        The llm_proxy.generate_text tool requires tenant_id and messages.
        Hosted text also requires idempotency_key and returns the original execution identifier for identical requests.
        A concurrent hosted request returns state dispatched without generated text.
        The llm-proxy://tenants/{tenant_id}/routes resource template provides configured text routes.
        Tool execution failures use isError with a sanitized code.
        Resource errors and protocol errors use JSON-RPC errors with the protocol HTTP status.
      security:
        - MCPAccessToken: []
      parameters:
        - name: MCP-Protocol-Version
          in: header
          description: >-
            Send the negotiated version after initialization. The initial handshake can omit this header.
            An absent header selects the protocol-defined 2025-03-26 default. Repeated headers are rejected.
          schema:
            type: string
            enum: ['2026-07-28', '2025-11-25', '2025-06-18', '2025-03-26']
        - name: Mcp-Method
          in: header
          schema:
            type: string
          description: Required for 2026-07-28. The value must equal the JSON-RPC method.
        - name: Mcp-Name
          in: header
          schema:
            type: string
          description: Supply the tool name for tools/call or the resource URI for resources/read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPRequest'
      responses:
        '200':
          description: An MCP result or application error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPResponse'
        '202':
          description: The handshake-family notification was accepted. The response has no body.
        '400':
          description: The protocol version, resource URI, or request is invalid.
        '401':
          description: A valid TAuth OAuth access token is required.
          headers:
            WWW-Authenticate:
              schema:
                type: string
        '403':
          description: The required scope is absent or the origin is prohibited.
        '404':
          description: The MCP method is unknown.
        '406':
          description: The Accept header does not permit the required response type.
        '408':
          description: The request body did not arrive within the server timeout or the request was canceled.
        '413':
          description: The request exceeds the configured message limit.
        '415':
          description: The request content type is unsupported.
        '500':
          description: The requested resource is unavailable because of a server error.
  /healthz:
    get:
      operationId: getHealth
      summary: Read local datastore readiness without authentication or provider work.
      security: []
      responses:
        '200':
          description: The local datastore is available.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    const: ok
        '503':
          description: The local datastore is unavailable.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    const: unavailable
