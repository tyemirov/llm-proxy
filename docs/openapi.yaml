    MediaOperation:
      type: object
      additionalProperties: false
      required: [operation_id, capability, provider, catalog_revision, state, cancellation_state, outputs, cost, accepted_at, updated_at, deadline_at]
      properties:
        previous_operation_id:
          type: string
          pattern: ^mop_[0-9a-f]{32}$
          description: The successful tenant operation used as the Responses chain parent.
        operation_id:
          type: string
          pattern: ^mop_[0-9a-f]{32}$
        capability:
          type: string
          minLength: 1
        provider:
          type: string
          minLength: 1
        model:
          type: string
          minLength: 1
        catalog_revision:
          type: string
          minLength: 1
        state:
          type: string
          enum: [queued, running, succeeded, failed, cancelled, uncertain]
        cancellation_state:
          type: string
          enum: [not_requested, requested, confirmed, unsupported]
        outputs:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [asset_id, mime_type, size_bytes, ordinal]
            properties:
              asset_id:
                type: string
                pattern: ^ast_[0-9a-f]{32}$
              mime_type:
                type: string
                minLength: 1
              size_bytes:
                type: integer
                format: int64
                minimum: 1
              ordinal:
                type: integer
                minimum: 0
        partial_outputs:
          type: array
          description: Verified preview assets in output and partial order. Available during execution and retained with the operation.
          items:
            type: object
            additionalProperties: false
            required: [asset_id, mime_type, size_bytes, output_ordinal, partial_ordinal]
            properties:
              asset_id:
                type: string
                pattern: ^ast_[0-9a-f]{32}$
              mime_type:
                type: string
                minLength: 1
              size_bytes:
                type: integer
                format: int64
                minimum: 1
              output_ordinal:
                type: integer
                minimum: 0
              partial_ordinal:
                type: integer
                minimum: 0
        error:
          type: object
          additionalProperties: false
          required: [code]
          properties:
            code:
              type: string
              enum: [provider_error, provider_rate_limited, operation_deadline_exceeded, provider_outcome_unknown, worker_claim_lost, asset_publication_failed, provider_result_invalid, media_operation_unavailable, usage_journal_unavailable]
        cost:
          type: object
          additionalProperties: false
          required: [available]
          properties:
            available:
              type: boolean
            reason:
              type: string
              minLength: 1
        accepted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deadline_at:
          type: string
          format: date-time
    MediaOperationErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code]
          properties:
            code:
              type: string
              enum: [media_operation_invalid, media_operation_unavailable, media_operation_not_found, media_operation_intent_conflict, media_operation_capacity_exceeded, media_operation_store_error]
    MediaOperationExpired:
      type: object
      additionalProperties: false
      required: [operation_id, state, error]
      properties:
        operation_id:
          type: string
          pattern: ^mop_[0-9a-f]{32}$
        state:
          type: string
          enum: [succeeded, failed, cancelled]
        error:
          type: object
          additionalProperties: false
          required: [code]
          properties:
            code:
              const: media_operation_expired
    MediaVoice:
      type: object
