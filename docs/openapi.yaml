        role:
          type: string
          const: user
        content:
          type: string
          minLength: 1
        attachments:
          type: array
          minItems: 1
          description: Ordered exact media inputs accepted only when the resolved model declares each media type.
          items:
            $ref: '#/components/schemas/MessageAttachment'
        order:
          type: integer
          minimum: 0
    V2SystemOrAssistantChatMessage:
      type: object
      additionalProperties: false
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - system
            - assistant
        content:
          type: string
          minLength: 1
        order:
          type: integer
          minimum: 0
    TextRequest:
      type: object
      additionalProperties: false
      properties:
        prompt:
          type: string
          minLength: 1
        messages:
          type: array
          minItems: 1
          description: >-
            Each Gemini Interactions route rejects assistant history. Other
            routes retain their declared message behavior.
          items:
            $ref: '#/components/schemas/ChatMessage'
        model:
          type: string
          minLength: 1
        web_search:
          type: boolean
        system_prompt:
          type: string
        max_tokens:
          type: integer
          minimum: 1
          description: Initial output budget. A transport that declares continuation actions reuses it for missing-suffix attempts.
        reasoning_effort:
          type: string
          minLength: 1
          description: >-
            Omission selects the tenant or route default. An explicit value
            must be non-blank and supported by the resolved provider/model
            route.
    V2Request:
      type: object
      additionalProperties: false
      required:
        - messages
      properties:
        messages:
          type: array
          minItems: 1
          description: >-
            Each message must have an allowed role and non-blank content. The
            request must include at least one user message. All messages must
            omit order, or all must have unique non-negative order values. Only
            user messages can have attachments. Message and attachment order
            are preserved. Each Gemini Interactions route rejects assistant
            history.
          items:
            $ref: '#/components/schemas/V2ChatMessage'
        model:
          type: string
          minLength: 1
          description: Omission selects the resolved provider default.
        web_search:
          type: boolean
          description: The resolved route must declare web-search capability when true.
        max_tokens:
          type: integer
          minimum: 1
          description: Initial output budget. A transport that declares continuation actions reuses it for missing-suffix attempts.
        reasoning_effort:
          type: string
          minLength: 1
          description: >-
            Omission selects the tenant or route default. An explicit value
            must be non-blank and supported by the resolved provider/model
            route. Kimi K3 accepts low, high, or max.
        structured_output:
          $ref: '#/components/schemas/StructuredOutput'
    StructuredOutput:
      type: object
      additionalProperties: false
      required:
        - schema
      properties:
        schema:
          type: object
          description: JSON Schema admitted against the selected provider subset, enforced by that provider, and revalidated by llm-proxy before durable success.
    StructuredRequestStatus:
      type: object
      additionalProperties: false
      required:
        - state
        - proxy_request_id
        - started_at
        - updated_at
        - elapsed_seconds
      properties:
        state:
          type: string
          enum:
            - not_dispatched
            - dispatched
        proxy_request_id:
          type: string
          minLength: 1
        started_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        elapsed_seconds:
          type: integer
          format: int64
          minimum: 0
    StructuredRequestErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/StructuredRequestError'
    StructuredRequestError:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - invalid_idempotency_key
            - structured_request_not_found
            - structured_request_intent_conflict
            - structured_request_outcome_unknown
            - structured_request_failed
            - structured_request_invalid
            - structured_request_store_error
        state:
          type: string
          enum:
            - failed
            - uncertain
        cause:
          type: string
          minLength: 1
        proxy_request_id:
          type: string
          minLength: 1
    DictationRequest:
      type: object
      additionalProperties: false
      required:
        - audio
      properties:
        audio:
          type: string
          format: binary
          description: The canonical incoming audio file part.
    DictationResponse:
