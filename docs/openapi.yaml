        dictation_model:
          type: string
          description: Canonical dictation model paired with dictation_provider, or empty when dictation_provider is empty.
        system_prompt:
          type: string
        reasoning_effort:
          type: string
    ProviderProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - label
        - aliases
        - configured
        - fields
        - text_model
        - system_prompt
        - text_default_model
        - text_models
        - supports_dictation
        - dictation_models
      properties:
        id:
          type: string
        label:
          type: string
        aliases:
          type: array
          items:
            type: string
        configured:
          type: boolean
        fields:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProviderField'
        text_model:
          type: string
        system_prompt:
          type: string
        text_default_model:
          type: string
        text_models:
          type: array
          items:
            $ref: '#/components/schemas/TextModel'
        supports_dictation:
          type: boolean
        dictation_default_model:
          type: string
        dictation_models:
          type: array
          items:
            type: string
    ProviderField:
      type: object
      additionalProperties: false
      allOf:
        - if:
            properties:
              secret:
                const: false
            required:
              - secret
          then:
            required:
              - value
            not:
              required:
                - masked_value
        - if:
            properties:
              secret:
                const: true
              configured:
                const: true
            required:
              - secret
              - configured
          then:
            required:
              - masked_value
            not:
              required:
                - value
        - if:
            properties:
              secret:
                const: true
              configured:
                const: false
            required:
              - secret
              - configured
          then:
            not:
              anyOf:
                - required:
                    - value
                - required:
                    - masked_value
      required:
        - id
        - label
        - kind
        - type
        - required
        - default
        - secret
        - validation
        - configured
      properties:
        id:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
        kind:
          type: string
          enum:
            - credential
            - setting
        type:
          type: string
          enum:
            - opaque
            - url
        required:
          type: boolean
        default:
          type: string
        secret:
          type: boolean
        validation:
          $ref: '#/components/schemas/ProviderFieldValidation'
        configured:
          type: boolean
        value:
          type: string
          description: Current nonsecret value. Secret fields never expose this property in profile responses.
        masked_value:
          type: string
          description: Safe placeholder for a configured secret. Nonsecret and unconfigured secret fields omit this property.
    ProviderFieldValidation:
      type: object
      additionalProperties: false
      properties:
        minimum_length:
          type: integer
          minimum: 1
        pattern:
          type: string
          minLength: 1
        allowed_schemes:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
    TextModel:
      type: object
      additionalProperties: false
      required:
        - id
      properties:
        id:
          type: string
        reasoning_effort:
          $ref: '#/components/schemas/ReasoningEffortCapability'
    ReasoningEffortCapability:
