  /model/v1/provider-diagnostics/{provider}:
    get:
      operationId: getProviderDiagnostics
      summary: Read retained tenant operation counts for a provider
      description: >-
        Counts include only retained media operations owned by the authenticated tenant for the selected provider.
        Each accepted operation counts once. Repeated status reads and idempotent retries do not add operations.
        Counts include every retained state, including uncertain. Terminal detail expiry removes its count.
        These are retained operation counts, not lifetime usage or billing totals.
        An assigned connection is required. Connection changes do not transfer another tenant's history.
        The request does not contact the provider or return server health, uptime, or global latency.
      tags: [Proxy]
      security:
        - TenantBearerKey: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-z][a-z0-9_-]*$
        - $ref: '#/components/parameters/RequestTimeout'
      responses:
        '200':
          $ref: '#/components/responses/ProviderDiagnostics'
        '400':
          $ref: '#/components/responses/ProxyBadRequest'
        '403':
          $ref: '#/components/responses/ProxyForbidden'
        '404':
          $ref: '#/components/responses/ProviderDiagnosticsFailure'
        '405':
          $ref: '#/components/responses/ProviderDiagnosticsFailure'
        '500':
          $ref: '#/components/responses/ProviderDiagnosticsFailure'
    head:
      operationId: getProviderDiagnosticsHeaders
      summary: Read diagnostic response headers without a response body
      tags: [Proxy]
      security:
        - TenantBearerKey: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-z][a-z0-9_-]*$
        - $ref: '#/components/parameters/RequestTimeout'
      responses:
        '200':
          description: Retained tenant operation counts are available.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        default:
          description: The diagnostic read failed. The response has no body.
