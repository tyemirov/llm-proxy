      properties:
        id:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
    ProviderField:
      type: object
      additionalProperties: false
      allOf:
        - if:
            properties:
              secret:
                const: false
            required:
              - secret
          then:
            required:
              - value
            not:
              required:
                - masked_value
        - if:
            properties:
              secret:
                const: true
              configured:
                const: true
            required:
              - secret
              - configured
          then:
            required:
              - masked_value
            not:
              required:
                - value
        - if:
            properties:
              secret:
                const: true
              configured:
                const: false
            required:
              - secret
              - configured
          then:
            not:
              anyOf:
                - required:
                    - value
                - required:
                    - masked_value
      required:
        - id
        - label
        - kind
        - type
        - required
        - default
        - secret
        - validation
        - configured
      properties:
        id:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
        kind:
