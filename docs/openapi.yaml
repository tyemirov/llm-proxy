    V2ChatMessage:
      description: A text message, user media message, assistant function call, or matched tool result.
      oneOf:
        - $ref: '#/components/schemas/V2UserChatMessage'
        - $ref: '#/components/schemas/V2SystemOrAssistantChatMessage'
        - $ref: '#/components/schemas/V2AssistantToolMessage'
        - $ref: '#/components/schemas/V2ToolMessage'
    V2UserChatMessage:
