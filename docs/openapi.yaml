      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/OptionalOrigin'
      requestBody:
        $ref: '#/components/requestBodies/EmptyJSONRequest'
      responses:
        '200':
          $ref: '#/components/responses/TenantSecretSuccess'
        '401':
          $ref: '#/components/responses/ManagementUnauthorized'
        '403':
          $ref: '#/components/responses/ManagementForbidden'
        '404':
          $ref: '#/components/responses/ManagementNotFound'
        '415':
          $ref: '#/components/responses/ManagementUnsupportedMediaType'
        '500':
          $ref: '#/components/responses/ManagementInternalError'
components:
  securitySchemes:
    MCPAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: TAuth OAuth access token with the API audience and llm-proxy:use scope.
    TenantBearerKey:
      type: http
      scheme: bearer
      bearerFormat: tenant-client-key
    TenantClientKey:
      type: apiKey
      in: query
      name: key
      description: The tenant client secret generated by the management API.
    TAuthSession:
      type: apiKey
      in: cookie
      name: app_session_llm_proxy
      description: The exact deployment-configured TAuth session cookie. The production cookie name is configured through management.session_cookie_name.
  parameters:
    TenantClientKey:
      name: key
      in: query
      required: true
      description: Tenant client secret.
      schema:
        type: string
        minLength: 1
    Prompt:
      name: prompt
      in: query
      required: true
      description: User prompt.
      schema:
        type: string
        minLength: 1
    Provider:
      name: provider
      in: query
      required: false
      description: Canonical provider identifier from the public capability catalog, such as zai. Retired zhipu and glm values are invalid. Omission uses the tenant default.
      schema:
        type: string
        minLength: 1
    Model:
      name: model
      in: query
      required: false
      description: Model identifier. Omission uses the resolved provider default.
      schema:
        type: string
        minLength: 1
    WebSearch:
      name: web_search
      in: query
      required: false
      description: Exact boolean query parameter. Use true or false; omission disables web search. Any other supplied spelling is invalid and returns HTTP 400.
      schema:
        type: boolean
    SystemPrompt:
      name: system_prompt
      in: query
      required: false
      schema:
        type: string
    MaxTokens:
      name: max_tokens
      in: query
      required: false
      description: Initial per-attempt output budget. A transport that declares continuation actions reuses this budget for a missing suffix.
      schema:
        type: integer
        minimum: 1
    ReasoningEffort:
      name: reasoning_effort
      in: query
      required: false
      description: >-
        Non-blank effort supported by the resolved route. Omission selects the
        tenant or route default.
      schema:
        type: string
        minLength: 1
    ResponseFormat:
      name: format
      in: query
      required: false
      description: Preferred response media type. Unknown values select text/plain.
      schema:
        type: string
        enum:
          - text/plain
          - application/json
          - application/xml
          - text/xml
          - text/csv
    Accept:
      name: Accept
      in: header
      required: false
      description: Response media preference used when format is omitted.
      schema:
        type: string
    RequestTimeout:
      name: X-LLM-Proxy-Request-Timeout-Seconds
      in: header
      required: false
      description: A positive whole-second request budget no greater than the server maximum. Omission selects the configured default.
      schema:
        type: integer
        minimum: 1
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Required for hosted text and structured output. A hosted key identifies one tenant request across native and client protocols.
        An identical request returns its saved result or active receipt. Changed intent returns 409. Expired hosted results return 410.
        A hosted replay never starts another execution. For account-owned credentials, the key requires structured_output.
        A known failed request with account-owned credentials permits an explicit new attempt.
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    HostedCompletionIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Required for hosted text and dictation. The key identifies one tenant request across native and client protocols.
        An identical request returns its saved result or active receipt. Changed intent returns 409.
        Expired hosted results return 410. A hosted replay never starts another execution.
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    HostedPageLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    BillingAccountID:
      name: billing_account_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^billing-[a-f0-9]{32}$'
    JournalRequestID:
      name: request_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^request-[a-f0-9]{32}$'
    HostedGrantID:
      name: grant_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^grant-[a-f0-9]{32}$'
    HostedCreationKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A creation key scoped to the authenticated actor and resource kind.
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    PlatformConnectionID:
      name: platform_connection_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^platform-[a-f0-9]{32}$'
    ConnectionCreationKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Account-scoped key for one connection creation request. Repeat the same
        key and request to receive the original 201 response and Location.
        A changed request returns 409. Receipts survive connection deletion.
        Read the connection resource for its current state.
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Exact key of the durable structured-output request to reconcile.
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    MediaOperationIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Tenant-bound key for one durable media operation intent. Exact repeats converge to the retained operation or tombstone. Changed intent returns 409 before dispatch.
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
    AssetID:
      name: asset_id
      in: path
      required: true
      description: Opaque tenant asset identifier.
      schema:
        type: string
        pattern: ^ast_[0-9a-f]{32}$
    MediaOperationID:
      name: operation_id
      in: path
      required: true
      description: Opaque durable media operation identifier.
      schema:
        type: string
        pattern: ^mop_[0-9a-f]{32}$
    MediaVoiceID:
      name: voice_id
      in: path
      required: true
      description: Opaque tenant voice identifier.
      schema:
        type: string
        pattern: ^voi_[0-9a-f]{32}$
    TenantID:
      name: tenant_id
      in: path
      required: true
      description: Opaque tenant identifier from the authenticated account response.
      schema:
        type: string
        minLength: 1
    ProviderPath:
      name: provider
      in: path
      required: true
      description: Canonical provider identifier from the public capability catalog, such as zai. Retired zhipu and glm values are invalid.
      schema:
        type: string
        minLength: 1
    ProviderFieldPath:
      name: field
      in: path
      required: true
      description: Canonical secret field identifier from the selected provider definition.
      schema:
        type: string
        minLength: 1
    UsageInterval:
      name: interval
      in: query
      required: true
      schema:
        type: string
        enum:
          - 1d
          - 7d
          - 30d
          - all
    UsageDetailLimit:
      name: limit
      in: query
      required: false
      description: Maximum failure rows in this page. Omission selects 25.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    UsageDetailCursor:
      name: cursor
      in: query
      required: false
      description: Opaque continuation cursor returned by the preceding page for the same interval and reporting scope.
      schema:
        type: string
        minLength: 1
    OptionalOrigin:
      name: Origin
      in: header
      required: false
      description: When supplied, must exactly match the configured public origin for mutations. Matching origins receive credentialed CORS headers.
      schema:
        type: string
        format: uri
    RequiredOrigin:
      name: Origin
      in: header
      required: true
      description: Must exactly match the configured public origin.
      schema:
        type: string
        format: uri
  requestBodies:
    TextRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TextRequest'
    V2Request:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/V2Request'
    DictationRequest:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: '#/components/schemas/DictationRequest'
          encoding:
            audio:
              contentType: audio/*,application/octet-stream
    AssetUpload:
      required: true
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
        application/json:
          schema: {}
        application/x-subrip:
          schema:
            type: string
            format: binary
        image/jpeg:
          schema:
            type: string
            format: binary
        image/png:
          schema:
            type: string
            format: binary
        image/webp:
          schema:
            type: string
            format: binary
        audio/m4a:
          schema:
            type: string
            format: binary
        audio/mpeg:
          schema:
            type: string
            format: binary
        audio/wav:
          schema:
            type: string
            format: binary
        audio/flac:
          schema:
            type: string
            format: binary
        audio/ogg:
          schema:
            type: string
            format: binary
        video/mp4:
          schema:
            type: string
            format: binary
        video/webm:
          schema:
            type: string
            format: binary
    TenantNameRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TenantNameRequest'
    DefaultsRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DefaultsRequest'
    EmptyJSONRequest:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmptyObject'
  responses:
    TextSuccess:
      description: >-
        Complete generated text in the selected representation. Each provider
        offering publishes one validated wire contract and an execution
        lifecycle for text-only requests. A media-capable offering also
        publishes media_execution_lifecycle for requests that contain image or
        audio input. The proxy does not infer a lifecycle from an endpoint or
        an upstream identifier. The proxy observes queued and in_progress
        states only for a pollable lifecycle. Each public operation remains
        blocking. Gemini media requests use synchronous completion and do not
        poll an Interaction resource. Transports with continuation actions
        continue exact output-budget stops through new provider calls. These
        transports are OpenAI Responses incomplete/max_output_tokens,
        OpenAI-compatible Chat Completions length, and Anthropic max_tokens.
        Gemini Interactions has no continuation actions. An incomplete result
        returns a provider error after cleanup. The adapter returns HTTP 200
        only after the provider reports its complete signal. These signals are
        OpenAI or Gemini completed, Chat stop, or Anthropic end_turn or
        stop_sequence. Intermediate, safety, refusal, tool, malformed, missing,
        and unknown states do not return text as success.
      headers:
        X-LLM-Proxy-Request-Timeout-Seconds:
          $ref: '#/components/headers/ResolvedRequestTimeout'
        X-LLM-Proxy-Request-Tokens:
          $ref: '#/components/headers/OptionalTokenCount'
        X-LLM-Proxy-Response-Tokens:
          $ref: '#/components/headers/OptionalTokenCount'
        X-LLM-Proxy-Total-Tokens:
          $ref: '#/components/headers/OptionalTokenCount'
      content:
        text/plain:
          schema:
            type: string
        application/json:
          schema:
            $ref: '#/components/schemas/TextJSONResponse'
        application/xml:
          schema:
            type: string
        text/csv:
          schema:
            type: string
    V2Success:
      description: Final text, caller-schema JSON, or caller function calls. Structured output includes durable request state. Function calls use NativeToolResult.
      headers:
        X-LLM-Proxy-Request-Timeout-Seconds:
          $ref: '#/components/headers/ResolvedRequestTimeout'
        X-LLM-Proxy-Request-Tokens:
          $ref: '#/components/headers/OptionalTokenCount'
        X-LLM-Proxy-Response-Tokens:
          $ref: '#/components/headers/OptionalTokenCount'
        X-LLM-Proxy-Total-Tokens:
          $ref: '#/components/headers/OptionalTokenCount'
        X-LLM-Proxy-Structured-Request-State:
          $ref: '#/components/headers/OptionalStructuredRequestState'
      content:
        text/plain:
          schema:
            type: string
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/NativeToolResult'
              - description: Native text response or JSON that passes the caller schema.
        application/xml:
          schema:
            type: string
        text/csv:
          schema:
            type: string
    DictationSuccess:
      description: Transcription result.
      headers:
        X-LLM-Proxy-Request-Timeout-Seconds:
          $ref: '#/components/headers/ResolvedRequestTimeout'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DictationResponse'
    ProxyBadRequest:
      description: The request is malformed, names an invalid route/capability, or supplies an invalid timeout. Text validation failures use the canonical plain-text error. Timeout-header validation uses the canonical JSON error.
      headers:
        X-LLM-Proxy-Request-Timeout-Seconds:
          $ref: '#/components/headers/OptionalResolvedRequestTimeout'
      content:
        text/plain:
          schema:
            type: string
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ProxyErrorEnvelope'
              - $ref: '#/components/schemas/StructuredRequestErrorEnvelope'
    ProxyForbidden:
      description: The tenant client key is absent or unknown, or hosted admission is denied.
      content:
        text/plain:
          schema:
            type: string
            const: unknown client key
        application/json:
          schema:
            $ref: '#/components/schemas/ProviderErrorEnvelope'
    TenantIdentitySuccess:
      description: Server-resolved identity for the authenticated tenant.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TenantIdentity'
    ProxyPayloadTooLarge:
      description: The compatibility JSON request limit, dictation audio limit, tenant asset limit, or selected provider media limit was exceeded.
      headers:
        X-LLM-Proxy-Request-Timeout-Seconds:
          $ref: '#/components/headers/ResolvedRequestTimeout'
      content:
        text/plain:
          schema:
            type: string
        application/json:
          schema:
            $ref: '#/components/schemas/ProviderErrorEnvelope'
    V2BadRequest:
      description: The canonical message input or referenced asset is invalid.
      headers:
        X-LLM-Proxy-Request-Timeout-Seconds:
          $ref: '#/components/headers/OptionalResolvedRequestTimeout'
      content:
        text/plain:
          schema:
            type: string
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ProxyErrorEnvelope'
              - $ref: '#/components/schemas/AssetErrorEnvelope'
              - $ref: '#/components/schemas/StructuredRequestErrorEnvelope'
    V2StructuredRequestPending:
      description: The durable request is active. Reconcile the same key again.
      headers:
        X-LLM-Proxy-Request-Timeout-Seconds:
          $ref: '#/components/headers/ResolvedRequestTimeout'
        X-LLM-Proxy-Structured-Request-State:
          $ref: '#/components/headers/StructuredRequestState'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StructuredRequestStatus'
    V2Conflict:
      description: The provider is not configured, or the key identifies a different intent or an uncertain provider outcome.
      headers:
        X-LLM-Proxy-Request-Timeout-Seconds:
          $ref: '#/components/headers/ResolvedRequestTimeout'
      content:
        text/plain:
          schema:
            type: string
            enum:
              - provider_not_configured
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/StructuredRequestErrorEnvelope'
              - $ref: '#/components/schemas/ProviderErrorEnvelope'
    V2InternalFailure:
      description: The asset store or structured request store failed.
      headers:
        X-LLM-Proxy-Request-Timeout-Seconds:
          $ref: '#/components/headers/ResolvedRequestTimeout'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/AssetErrorEnvelope'
              - $ref: '#/components/schemas/StructuredRequestErrorEnvelope'
    AssetAvailable:
      description: The asset metadata is available to its authenticated tenant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TenantAsset'
    AssetCreated:
      description: The asset is available to its authenticated tenant.
      headers:
        X-LLM-Proxy-Request-Timeout-Seconds:
          $ref: '#/components/headers/ResolvedRequestTimeout'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TenantAsset'
    AssetFailure:
      description: The asset operation failed with a stable safe code.
      headers:
        X-LLM-Proxy-Request-Timeout-Seconds:
          $ref: '#/components/headers/OptionalResolvedRequestTimeout'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AssetErrorEnvelope'
    MediaOperation:
      description: Current durable media operation state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaOperation'
    MediaOperationFailure:
      description: The media operation request failed with a stable caller-safe code.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaOperationErrorEnvelope'
    MediaOperationExpired:
      description: Terminal operation detail expired. The tenant idempotency tombstone remains.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaOperationExpired'
    ProviderDiagnostics:
      description: Retained tenant operation counts for one assigned provider.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProviderDiagnostics'
    ProviderDiagnosticsFailure:
      description: A diagnostic read failed with a stable public code.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error]
            properties:
              error:
                type: object
                additionalProperties: false
                required: [code]
                properties:
                  code:
                    type: string
                    enum: [provider_diagnostics_not_found, media_operation_store_error, method_not_allowed]
    ProviderResourceFailure:
      description: The assigned resource is absent or the provider observation is unavailable.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error]
            properties:
              error:
                type: object
                additionalProperties: false
                required: [code]
                properties:
                  code:
                    type: string
                    enum: [provider_resource_not_found, provider_resource_unavailable]
    MediaVoice:
      description: One tenant-owned voice without native provider identifiers.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaVoice'
    MediaVoiceCollection:
      description: Tenant-owned voices discovered from the selected provider.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaVoiceCollection'
    MediaVoiceFailure:
      description: The voice request failed with a stable caller-safe code.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaVoiceErrorEnvelope'
    HostedClientFailure:
      description: Hosted authority is denied, request intent conflicts, the outcome is unknown, or the saved result expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpenAIError'
    HostedResultExpired:
      description: The saved hosted result expired. The journal keeps the request identity and prevents another execution.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProviderErrorEnvelope'
    V2Expired:
      description: A referenced asset or saved hosted result expired.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/AssetErrorEnvelope'
              - $ref: '#/components/schemas/ProviderErrorEnvelope'
    StructuredRequestExpired:
      description: The saved hosted result expired. The journal keeps the request identity and prevents another execution.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StructuredRequestErrorEnvelope'
    StructuredRequestSucceeded:
      description: >-
        A saved hosted completion contains text, optional tool_calls, and optional usage.
        An account-owned structured request returns the exact JSON that passed its caller schema.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-LLM-Proxy-Structured-Request-State:
          $ref: '#/components/headers/StructuredRequestState'
      content:
        application/json:
          schema: {}
    StructuredRequestPending:
      description: The durable request has not reached a terminal state. Reconcile the same key again.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-LLM-Proxy-Structured-Request-State:
          $ref: '#/components/headers/StructuredRequestState'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StructuredRequestStatus'
    StructuredRequestBadRequest:
      description: The Idempotency-Key is missing or invalid.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StructuredRequestErrorEnvelope'
    StructuredRequestNotFound:
      description: No durable request exists for the authenticated tenant and key.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StructuredRequestErrorEnvelope'
    StructuredRequestConflict:
      description: The key names a different request intent, or provider dispatch completed with an outcome that cannot be proven.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StructuredRequestErrorEnvelope'
    StructuredRequestFailed:
      description: The durable request reached a safe terminal provider failure.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-LLM-Proxy-Structured-Request-State:
          $ref: '#/components/headers/StructuredRequestState'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StructuredRequestErrorEnvelope'
    StructuredRequestStoreFailure:
      description: The durable request record cannot be read or updated.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StructuredRequestErrorEnvelope'
    ProxyRateLimited:
      description: The selected upstream provider returned HTTP 429. The proxy preserves 429 at its public boundary and returns only sanitized provider metadata; it never exposes the raw provider body or message.
      headers:
        X-LLM-Proxy-Request-Timeout-Seconds:
          $ref: '#/components/headers/ResolvedRequestTimeout'
        X-LLM-Proxy-Request-ID:
          $ref: '#/components/headers/ProxyRequestID'
        Retry-After:
          $ref: '#/components/headers/SafeRetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProviderErrorEnvelope'
    CallerClosed:
      description: The caller canceled or closed the request.
    ProxyBadGateway:
      description: >-
        The provider failed or returned an unusable response. A retained request failure uses the durable error representation.
        The proxy continues output-budget stops only when the execution contract permits another attempt.
        Errors exclude partial text, token-count headers, and raw provider errors. The journal can retain available usage after failure.
      headers:
        X-LLM-Proxy-Request-Timeout-Seconds:
          $ref: '#/components/headers/ResolvedRequestTimeout'
        X-LLM-Proxy-Request-ID:
          $ref: '#/components/headers/ProxyRequestID'
        Retry-After:
          $ref: '#/components/headers/SafeRetryAfter'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ProviderErrorEnvelope'
              - $ref: '#/components/schemas/StructuredRequestErrorEnvelope'
    ProxyUnavailable:
      description: The bounded request queue is full.
      headers:
        X-LLM-Proxy-Request-Timeout-Seconds:
          $ref: '#/components/headers/ResolvedRequestTimeout'
      content:
        text/plain:
          schema:
            type: string
    ProviderNotConfigured:
      description: The selected catalog route cannot execute because its provider credentials are not configured. No provider dispatch occurs.
      headers:
        X-LLM-Proxy-Request-Timeout-Seconds:
          $ref: '#/components/headers/ResolvedRequestTimeout'
      content:
        text/plain:
          schema:
            type: string
            enum:
              - provider_not_configured
    ProxyTimeout:
      description: The proxy request budget or upstream operation timed out.
      headers:
        X-LLM-Proxy-Request-Timeout-Seconds:
          $ref: '#/components/headers/ResolvedRequestTimeout'
      content:
        text/plain:
          schema:
            type: string
        application/json:
          schema:
            $ref: '#/components/schemas/ProxyErrorEnvelope'
    HostedResourceError:
      description: The hosted resource request failed.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error]
            properties:
              error:
                type: object
                additionalProperties: false
                required: [code]
                properties:
                  code:
                    type: string
                    enum:
                      - billing_account_invalid
                      - billing_account_conflict
                      - billing_account_not_found
                      - billing_account_store_failed
                      - hosted_access_invalid
                      - hosted_access_conflict
                      - hosted_access_not_found
                      - hosted_access_store_failed
    HostedAccessGrantSuccess:
      description: The grant state. Only operators receive the platform connection identifier.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HostedAccessGrant'
    PlatformConnectionSuccess:
      description: Platform metadata without credentials. Only operators can read this resource.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlatformConnection'
    AccountSuccess:
      description: Authenticated account snapshot.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManagementAccount'
    TenantProfileSuccess:
      description: Current tenant profile.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TenantProfile'
    TenantProfileCreated:
      description: Created tenant profile.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TenantProfile'
    UsageSuccess:
      description: Usage summary for the exact requested interval and authenticated reporting scope.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UsageSummary'
    UsageFailuresSuccess:
      description: Snapshot page of safe tenant failure details for the exact requested interval.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UsageFailurePage'
    AccountUsageFailuresSuccess:
      description: Snapshot page of safe failure details across every owned tenant for the exact requested interval.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountUsageFailurePage'
    UsageRejectionsSuccess:
      description: Snapshot page of safe tenant rejection details for the exact requested interval.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UsageRejectionPage'
    AccountUsageRejectionsSuccess:
      description: Snapshot page of safe rejection details across every owned tenant for the exact requested interval.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountUsageRejectionPage'
    AdminUsersSuccess:
      description: Administrative user and tenant usage summary.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminUsersSummary'
    TenantSecretSuccess:
      description: The newly generated tenant client secret and current profile. The secret is returned only by this response.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TenantSecret'
    ManagementBadRequest:
      description: Malformed or invalid management input.
      content:
        text/plain:
          schema:
            type: string
    ManagementUnauthorized:
      description: The TAuth session is absent or invalid.
    ManagementForbidden:
      description: The user lacks the required role or the supplied Origin is not allowed.
    ManagementNotFound:
      description: The tenant or provider credential does not exist within the authenticated ownership boundary.
    ManagementConflict:
      description: The requested tenant name conflicts, the final owned tenant cannot be deleted, or a retained provider credential changed after verification began.
      content:
        text/plain:
          schema:
            type: string
    ManagementUnsupportedMediaType:
      description: A management mutation did not supply application/json.
    ProviderKeyRejected:
      description: The candidate credential was rejected or cannot access the selected text model. Nothing was saved.
      content:
        text/plain:
          schema:
            type: string
            const: provider_key_rejected
    ProviderKeyVerificationRateLimited:
      description: The provider rate-limited the single verification operation. The credential remains unconfirmed and nothing was saved.
      content:
        text/plain:
          schema:
            type: string
            const: provider_key_verification_rate_limited
    ProviderKeyVerificationUnavailable:
      description: The provider was unavailable or returned a malformed success envelope. The credential remains unconfirmed and nothing was saved.
      content:
        text/plain:
          schema:
            type: string
            const: provider_key_verification_unavailable
    ProviderKeyVerificationTimedOut:
      description: The single verification operation timed out or was canceled. The credential remains unconfirmed and nothing was saved.
      content:
        text/plain:
          schema:
            type: string
            const: provider_key_verification_timed_out
    ManagementInternalError:
      description: The management operation failed internally.
      content:
        text/plain:
          schema:
            type: string
  headers:
    ResolvedRequestTimeout:
      description: The resolved whole-second budget used for the request.
      schema:
        type: integer
        minimum: 1
      x-required: true
    OptionalResolvedRequestTimeout:
      description: Present after the supplied timeout header passes validation.
      schema:
        type: integer
        minimum: 1
    ProxyRequestID:
      description: Proxy-owned identifier matching error.request_id and the request_id field in structured proxy logs.
      schema:
        type: string
        minLength: 1
      x-required: true
    SafeRetryAfter:
      description: Present only when the provider supplied a syntactically valid Retry-After value. Delta seconds are normalized to unsigned decimal form and HTTP dates are normalized to IMF-fixdate.
      schema:
        type: string
        minLength: 1
    OptionalTokenCount:
      description: Provider-reported token count when available.
      schema:
        type: integer
        minimum: 0
    NoStore:
      description: Prevents persistence of authenticated or secret-bearing responses.
      schema:
        type: string
        const: no-store
      x-required: true
    StructuredRequestState:
      description: Current durable state of the structured request.
      schema:
        type: string
        enum:
          - not_dispatched
          - dispatched
          - succeeded
          - failed
          - uncertain
      x-required: true
    OptionalStructuredRequestState:
      description: Present when this response belongs to a structured request.
      schema:
        type: string
        enum:
          - not_dispatched
          - dispatched
          - succeeded
          - failed
          - uncertain
  schemas:
    AccountConnectionWrite:
      type: object
      additionalProperties: false
      required:
        - name
        - provider
        - fields
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        provider:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
        version:
          type: integer
          minimum: 0
          description: Use zero or omit on creation. Updates require the current connection version.
    AccountConnection:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - provider
        - version
        - fields
        - tenant_ids
        - created_at
        - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          type: string
        version:
          type: integer
          minimum: 1
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ProviderField'
        tenant_ids:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AccountConnections:
      type: object
      additionalProperties: false
      required:
        - connections
        - providers
        - next_cursor
      properties:
        next_cursor:
          type: string
          description: The last returned connection ID when another page exists. An empty string indicates the last page.
        connections:
          type: array
          items:
            $ref: '#/components/schemas/AccountConnection'
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ProviderProfile'
    TenantConnectionAssignment:
      type: object
      additionalProperties: false
      required:
        - kind
        - resource_id
      properties:
        kind:
          $ref: '#/components/schemas/ProviderAssignmentKind'
        resource_id:
          type: string
          minLength: 1
    ProviderAssignmentKind:
      type: string
      enum: [account_connection, hosted_access_grant]
    TenantProviderAssignment:
      type: object
      additionalProperties: false
      required: [provider, kind, resource_id]
      properties:
        provider:
          type: string
          minLength: 1
        kind:
          $ref: '#/components/schemas/ProviderAssignmentKind'
        resource_id:
          type: string
          minLength: 1
    TenantProviderProfileWrite:
      type: object
      additionalProperties: false
      required:
        - text_model
        - system_prompt
      properties:
        text_model:
          type: string
          minLength: 1
        speech_provider:
          type: string
          description: Selected speech provider. An empty value clears the selection.
        speech_model:
          type: string
          description: Selected speech model. An empty value clears the selection.
        system_prompt:
          type: string
    ConnectionError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
          properties:
            code:
              type: string
    MCPRequest:
      type: object
      additionalProperties: false
      required: [jsonrpc, id, method]
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id:
          type: [string, integer]
        method:
          type: string
        params:
          type: object
          description: The MCP method defines parameters and required protocol metadata.
    MCPResponse:
      type: object
      additionalProperties: false
      required: [jsonrpc, id]
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id:
          type: [string, integer, 'null']
        result:
          type: object
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: integer
            message:
              type: string
      oneOf:
        - required: [result]
        - required: [error]
    MCPGenerateInput:
      type: object
      additionalProperties: false
      required: [tenant_id, messages]
      properties:
        tenant_id:
          type: string
          minLength: 1
        idempotency_key:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          description: Required for hosted text. Identifies one complete request within its tenant. Customer-owned text rejects this field.
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/V2ChatMessage'
        provider:
          type: string
        model:
          type: string
        web_search:
          type: boolean
        max_tokens:
          type: integer
          minimum: 1
        reasoning_effort:
          type: string
          minLength: 1
        request_timeout_seconds:
          type: integer
          minimum: 1
    MCPGenerateOutput:
      type: object
      oneOf:
        - $ref: '#/components/schemas/MCPGenerateCompletionOutput'
        - $ref: '#/components/schemas/MCPGeneratePendingOutput'
    MCPGenerateCompletionOutput:
      type: object
      additionalProperties: false
      required: [text, request_id, provider, model, usage, request_timeout_seconds]
      properties:
        text:
          type: string
        request_id:
          type: string
        provider:
          type: string
        model:
          type: string
        usage:
          oneOf:
            - $ref: '#/components/schemas/TokenUsage'
            - type: 'null'
        request_timeout_seconds:
          type: integer
          minimum: 1
    MCPGeneratePendingOutput:
      type: object
      additionalProperties: false
      required: [state, request_id, provider, model, request_timeout_seconds]
      properties:
        state:
          type: string
          enum: [dispatched]
        request_id:
          type: string
          description: The original hosted execution identifier.
        provider:
          type: string
        model:
          type: string
        request_timeout_seconds:
          type: integer
          minimum: 1
    ClientFunction:
      type: object
      additionalProperties: false
      required:
        - name
        - parameters
      properties:
        name:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
        description:
          type: string
        parameters:
          type: object
        strict:
          anyOf:
            - type: boolean
            - type: 'null'
    ClientFunctionCall:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - arguments
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
        arguments:
          type: string
          minLength: 2
    ClientToolChoice:
      type: object
      additionalProperties: false
      required:
        - mode
      properties:
        mode:
          enum:
            - auto
            - none
            - required
            - function
        name:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
    OpenAIError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - message
            - type
            - param
            - code
            - request_id
          properties:
            message:
              type: string
            type:
              enum:
                - invalid_request_error
                - authentication_error
                - rate_limit_error
                - server_error
            param:
              type: 'null'
            code:
              type: string
            request_id:
              type: string
              minLength: 1
    OpenAIModel:
      type: object
      additionalProperties: false
      required:
        - id
        - object
        - created
        - owned_by
      properties:
        id:
          type: string
          pattern: ^[^/]+/.+$
        object:
          const: model
        created:
          type: integer
          minimum: 0
        owned_by:
          type: string
    OpenAIModels:
      type: object
      additionalProperties: false
      required:
        - object
        - data
      properties:
        object:
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/OpenAIModel'
    OpenAIChatFunctionCall:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - function
      properties:
        id:
          type: string
          minLength: 1
        type:
          const: function
        function:
          type: object
          additionalProperties: false
          required:
            - name
            - arguments
          properties:
            name:
              type: string
              pattern: ^[A-Za-z0-9_-]{1,64}$
            arguments:
              type: string
    OpenAIChatTool:
      type: object
      additionalProperties: false
      required:
        - type
        - function
      properties:
        type:
          const: function
        function:
          $ref: '#/components/schemas/ClientFunction'
    OpenAIResponsesTool:
      type: object
      additionalProperties: false
      required:
        - type
        - name
        - parameters
      properties:
        type:
          const: function
        name:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
        description:
          type: string
        parameters:
          type: object
        strict:
          anyOf:
            - type: boolean
            - type: 'null'
    OpenAIJSONSchema:
      type: object
      additionalProperties: false
      required:
        - name
        - schema
      properties:
        name:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
        description:
          type: string
        schema:
          type: object
        strict:
          anyOf:
            - type: boolean
            - type: 'null'
    OpenAIChatUsage:
      type: object
      additionalProperties: false
      required:
        - prompt_tokens
        - completion_tokens
        - total_tokens
      properties:
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
    OpenAIResponsesUsage:
      type: object
      additionalProperties: false
      required:
        - input_tokens
        - output_tokens
        - total_tokens
      properties:
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
        input_tokens_details:
          type: object
          additionalProperties: false
          required:
            - cached_tokens
          properties:
            cached_tokens:
              type: integer
              minimum: 0
        output_tokens_details:
          type: object
          additionalProperties: false
          required:
            - reasoning_tokens
          properties:
            reasoning_tokens:
              type: integer
              minimum: 0
    OpenAIChatContent:
      anyOf:
        - type: string
        - type: 'null'
        - type: array
          items:
            type: object
            additionalProperties: false
            required:
              - type
              - text
            properties:
              type:
                const: text
              text:
                type: string
              annotations:
                type: array
                maxItems: 0
              logprobs:
                type: array
                maxItems: 0
    OpenAIChatMessage:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        role:
          enum:
            - system
            - developer
            - user
            - assistant
            - tool
        content:
          $ref: '#/components/schemas/OpenAIChatContent'
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/OpenAIChatFunctionCall'
        tool_call_id:
          type: string
        refusal:
          type: 'null'
    OpenAIChatRequest:
      type: object
      additionalProperties: false
      required:
        - model
        - messages
      properties:
        model:
          type: string
          pattern: ^[^/]+/.+$
        messages:
          type: array
          items:
            $ref: '#/components/schemas/OpenAIChatMessage'
          minItems: 1
        max_tokens:
          type: integer
          minimum: 1
        max_completion_tokens:
          type: integer
          minimum: 1
        reasoning_effort:
          type: string
          minLength: 1
        tools:
          type: array
          items:
            $ref: '#/components/schemas/OpenAIChatTool'
        tool_choice:
          anyOf:
            - enum:
                - auto
                - none
                - required
            - type: object
              additionalProperties: false
              required:
                - type
                - function
              properties:
                type:
                  const: function
                function:
                  type: object
                  additionalProperties: false
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      pattern: ^[A-Za-z0-9_-]{1,64}$
        parallel_tool_calls:
          type: boolean
        stream:
          type: boolean
        stream_options:
          type: object
          additionalProperties: false
          properties:
            include_usage:
              type: boolean
        store:
          const: false
        response_format:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - type
              properties:
                type:
                  const: text
            - type: object
              additionalProperties: false
              required:
                - type
                - json_schema
              properties:
                type:
                  const: json_schema
                json_schema:
                  $ref: '#/components/schemas/OpenAIJSONSchema'
      allOf:
        - not:
            required:
              - max_tokens
              - max_completion_tokens
        - if:
            required:
              - stream_options
          then:
            required:
              - stream
            properties:
              stream:
                const: true
    OpenAIResponseContentPart:
      type: object
      additionalProperties: false
      required:
        - type
        - text
      properties:
        type:
          enum:
            - input_text
            - output_text
        text:
          type: string
        annotations:
          type: array
          maxItems: 0
        logprobs:
          type: array
          maxItems: 0
    OpenAIResponseInputItem:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - role
            - content
          properties:
            type:
              const: message
            role:
              enum:
                - system
                - developer
                - user
                - assistant
            content:
              anyOf:
                - type: string
                - type: array
                  items:
                    $ref: '#/components/schemas/OpenAIResponseContentPart'
            id:
              type: string
            status:
              enum:
                - completed
                - in_progress
                - incomplete
        - type: object
          additionalProperties: false
          required:
            - type
            - call_id
            - name
            - arguments
          properties:
            type:
              const: function_call
            id:
              type: string
            status:
              enum:
                - completed
                - in_progress
                - incomplete
            call_id:
              type: string
              minLength: 1
            name:
              type: string
              pattern: ^[A-Za-z0-9_-]{1,64}$
            arguments:
              type: string
        - type: object
          additionalProperties: false
          required:
            - type
            - call_id
            - output
          properties:
            type:
              const: function_call_output
            id:
              type: string
            call_id:
              type: string
              minLength: 1
            output:
              type: string
    OpenAIResponsesRequest:
      type: object
      additionalProperties: false
      required:
        - model
        - input
      properties:
        model:
          type: string
          pattern: ^[^/]+/.+$
        input:
          anyOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/OpenAIResponseInputItem'
        instructions:
          type: string
        max_output_tokens:
          type: integer
          minimum: 1
        reasoning:
          type: object
          additionalProperties: false
          properties:
            effort:
              type: string
              minLength: 1
            summary:
              type: 'null'
        tools:
          type: array
          items:
            $ref: '#/components/schemas/OpenAIResponsesTool'
        tool_choice:
          anyOf:
            - enum:
                - auto
                - none
                - required
            - type: object
              additionalProperties: false
              required:
                - type
                - name
              properties:
                type:
                  const: function
                name:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{1,64}$
        parallel_tool_calls:
          type: boolean
        stream:
          type: boolean
        store:
          const: false
        include:
          type: array
          maxItems: 0
        prompt_cache_key:
          type: 'null'
        text:
          type: object
          additionalProperties: false
          properties:
            verbosity:
              type: 'null'
            format:
              oneOf:
                - type: object
                  additionalProperties: false
                  required:
                    - type
                  properties:
                    type:
                      const: text
                    description:
                      type: string
                - type: object
                  additionalProperties: false
                  required:
                    - type
                    - name
                    - schema
                  properties:
                    type:
                      const: json_schema
                    name:
                      type: string
                      pattern: ^[A-Za-z0-9_-]{1,64}$
                    description:
                      type: string
                    schema:
                      type: object
                    strict:
                      anyOf:
                        - type: boolean
                        - type: 'null'
    OpenAIChatCompletion:
      type: object
      additionalProperties: false
      required:
        - id
        - object
        - created
        - model
        - choices
        - usage
      properties:
        id:
          type: string
          pattern: ^chatcmpl-
        object:
          const: chat.completion
        created:
          type: integer
          minimum: 0
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - index
              - message
              - finish_reason
              - logprobs
            properties:
              index:
                type: integer
                minimum: 0
              message:
                $ref: '#/components/schemas/OpenAIChatMessage'
              finish_reason:
                enum:
                  - stop
                  - tool_calls
              logprobs:
                type: 'null'
        usage:
          anyOf:
            - $ref: '#/components/schemas/OpenAIChatUsage'
            - type: 'null'
    OpenAIResponseOutputItem:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - type
            - id
            - status
            - role
            - content
          properties:
