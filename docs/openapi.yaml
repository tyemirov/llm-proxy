        unknown_reason:
          type: string
          enum: [not_reported, invalid_quantity, unsupported_meter]
        included_in:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: The parent dimension that already includes this quantity. Do not add it to the parent again.
