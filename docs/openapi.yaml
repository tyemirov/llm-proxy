          $ref: '#/components/responses/HostedResourceError'
    patch:
      operationId: changeHostedAccessGrant
      summary: Change grant state with a revision precondition
      description: >-
        Only operators can change grants. Each change records its actor and reason in the same transaction.
        Suspended grants can return to active state. Revoked grants cannot return to another state.
        A stale revision or an unchanged state returns a conflict. Read the current resource before another change.
      tags: [Management]
      security:
        - TAuthSession: []
      x-llm-proxy-required-request-content-type: application/json
      parameters:
        - $ref: '#/components/parameters/OptionalOrigin'
