    ProviderResourceKind:
      type: string
      enum: [voices, voice_library, history, pronunciation_dictionaries, metadata, quotas, elements]
    ProviderResource:
      type: object
      additionalProperties: false
      required: [provider, kind]
      properties:
        provider:
          type: string
          minLength: 1
        kind:
          $ref: '#/components/schemas/ProviderResourceKind'
    MediaCapabilityService:
      type: object
      additionalProperties: false
      required: [capability, provider, controls, limits]
      properties:
        capability:
          enum: [audio.align, audio.dictionary.create]
        provider:
          type: string
          minLength: 1
        controls:
          type: array
          items:
            $ref: '#/components/schemas/PublicCatalogControl'
        limits:
          type: array
          items:
            $ref: '#/components/schemas/PublicCatalogLimit'
    MediaCapabilities:
      type: object
      additionalProperties: false
      required: [catalog_revision, routes, resources, services]
      properties:
        services:
          type: array
          items:
            $ref: '#/components/schemas/MediaCapabilityService'
        resources:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ProviderResource'
        catalog_revision:
          type: string
          minLength: 1
        routes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [capability, provider, model, controls, limits]
            properties:
              capability:
                type: string
                minLength: 1
              provider:
                type: string
                minLength: 1
              model:
                type: string
                minLength: 1
              controls:
                type: array
                items:
                  type: object
              limits:
                type: array
                items:
                  type: object
    MediaOperationRequest:
      oneOf:
        - $ref: '#/components/schemas/ImageGenerationOperationRequest'
        - $ref: '#/components/schemas/ImageEditingOperationRequest'
        - $ref: '#/components/schemas/VideoGenerationOperationRequest'
        - $ref: '#/components/schemas/DictatorTranscriptionOperationRequest'
        - $ref: '#/components/schemas/DictatorDiarizationOperationRequest'
        - $ref: '#/components/schemas/DictatorAlignmentOperationRequest'
        - $ref: '#/components/schemas/ProviderAlignmentOperationRequest'
        - $ref: '#/components/schemas/ProviderDictionaryOperationRequest'
        - $ref: '#/components/schemas/DictatorSubtitleOperationRequest'
        - $ref: '#/components/schemas/ProviderSpeechConversionOperationRequest'
        - $ref: '#/components/schemas/ProviderSpeechGenerationOperationRequest'
        - $ref: '#/components/schemas/DictatorSpeechGenerationOperationRequest'
        - $ref: '#/components/schemas/DictatorVoiceExtractionOperationRequest'
      discriminator:
        propertyName: capability
    ProviderDictionaryOperationRequest:
      type: object
      additionalProperties: false
      required: [capability, provider, input, controls]
      properties:
        capability:
          const: audio.dictionary.create
        provider:
          type: string
          minLength: 1
        input:
          $ref: '#/components/schemas/PronunciationDictionaryInput'
        controls:
          type: object
          additionalProperties: false
    PronunciationDictionaryInput:
      type: object
      additionalProperties: false
      required: [name, rules]
      properties:
        name:
          type: string
          pattern: '\S'
        description:
          type: [string, 'null']
        rules:
          type: array
          minItems: 1
          items:
            oneOf:
              - type: object
                additionalProperties: false
                required: [type, string_to_replace, alias]
                properties:
                  type: {const: alias}
                  string_to_replace: {type: string, pattern: '\S'}
                  alias: {type: string, pattern: '\S'}
              - type: object
                additionalProperties: false
                required: [type, string_to_replace, phoneme, alphabet]
                properties:
                  type: {const: phoneme}
                  string_to_replace: {type: string, pattern: '\S'}
                  phoneme: {type: string, pattern: '\S'}
                  alphabet: {type: string, pattern: '\S'}
    MediaDictionary:
      type: object
      additionalProperties: false
      description: The creation artifact contains owned references and provider observations. Native dictionary and version identifiers remain private.
      required: [dictionary_id, version_id, provider, name, created_by, creation_time_unix, version_rules_num, permission_on_resource, description]
      properties:
        dictionary_id: {type: string, pattern: '^dic_[0-9a-f]{32}$'}
        version_id: {type: string, pattern: '^div_[0-9a-f]{32}$'}
        provider: {type: string, minLength: 1}
        name: {type: string, pattern: '\S'}
        created_by: {type: string}
        creation_time_unix: {type: integer, minimum: 0}
        version_rules_num: {type: integer, minimum: 0}
        permission_on_resource: {type: [string, 'null']}
        description: {type: [string, 'null']}
    ProviderAlignmentOperationRequest:
      type: object
      additionalProperties: false
      required: [capability, provider, input, controls]
      properties:
        capability:
          const: audio.align
        provider:
          type: string
          minLength: 1
          description: A provider with an audio_alignment service in the current catalog.
        input:
          type: object
          additionalProperties: false
          required: [audio_asset_id, transcript]
          properties:
            audio_asset_id:
              type: string
              pattern: ^ast_[0-9a-f]{32}$
            transcript:
              type: string
              minLength: 1
              pattern: '\S'
        controls:
          type: object
          additionalProperties: false
    ProviderSpeechGenerationOperationRequest:
      allOf:
        - $ref: '#/components/schemas/MediaOperationRequestBase'
        - type: object
          properties:
            capability:
              const: audio.speech.generate
            input:
              type: object
              additionalProperties: false
              required: [text, voice_id]
              properties:
                text: {type: string, pattern: '\S'}
                voice_id: {type: string, pattern: '^voi_[0-9a-f]{32}$'}
                previous_text: {type: [string, 'null']}
                next_text: {type: [string, 'null']}
                previous_operation_ids:
                  type: [array, 'null']
                  maxItems: 3
                  items: {type: string, pattern: '^mop_[0-9a-f]{32}$'}
                next_operation_ids:
                  type: [array, 'null']
                  maxItems: 3
                  items: {type: string, pattern: '^mop_[0-9a-f]{32}$'}
                dictionaries:
                  type: [array, 'null']
                  maxItems: 3
                  items:
                    type: object
                    additionalProperties: false
                    required: [dictionary_id, version_id]
                    properties:
                      dictionary_id: {type: string, pattern: '^dic_[0-9a-f]{32}$'}
                      version_id: {type: string, pattern: '^div_[0-9a-f]{32}$'}
            controls:
              type: object
              additionalProperties: false
              required: [output_format, timestamps]
              properties:
                output_format:
                  type: string
                  minLength: 1
                  description: Use a format from the selected catalog offering.
                timestamps: {type: boolean}
                stability: {type: [number, 'null'], minimum: 0, maximum: 1}
                similarity_boost: {type: [number, 'null'], minimum: 0, maximum: 1}
                style: {type: [number, 'null'], minimum: 0, maximum: 1}
                use_speaker_boost: {type: [boolean, 'null']}
                speed: {type: [number, 'null'], minimum: 0.7, maximum: 1.2}
                seed: {type: [integer, 'null'], minimum: 0, maximum: 4294967295}
                language_code:
                  type: [string, 'null']
                  description: Use a language code declared by the selected offering.
                text_normalization:
                  type: [string, 'null']
                  enum: [auto, 'on', 'off', '', null]
                language_text_normalization: {type: [boolean, 'null']}
    MediaSpeechTiming:
      type: object
      additionalProperties: false
      required: [alignment, normalized_alignment]
      properties:
        alignment:
          anyOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/SpeechCharacterAlignment'}
        normalized_alignment:
          anyOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/SpeechCharacterAlignment'}
    SpeechCharacterAlignment:
      type: object
      additionalProperties: false
      required: [characters, character_start_times_seconds, character_end_times_seconds]
      properties:
        characters:
          type: array
          items: {type: string, minLength: 1}
        character_start_times_seconds:
          type: array
          items: {type: number, minimum: 0}
        character_end_times_seconds:
          type: array
          items: {type: number, minimum: 0}
    ProviderSpeechConversionOperationRequest:
      allOf:
        - $ref: '#/components/schemas/MediaOperationRequestBase'
        - type: object
          properties:
            capability:
              const: audio.speech.convert
            input:
              type: object
              additionalProperties: false
              required: [voice_id, audio_asset_id]
              properties:
                voice_id:
                  type: string
                  pattern: ^voi_[0-9a-f]{32}$
                audio_asset_id:
                  type: string
                  pattern: ^ast_[0-9a-f]{32}$
            controls:
              type: object
              additionalProperties: false
              required: [input_format, output_format]
              properties:
                input_format:
                  enum: [other, pcm_s16le_16]
                output_format:
                  type: string
                  description: Use a format from the selected catalog offering.
                  minLength: 1
                stability:
                  type: [number, 'null']
                  minimum: 0
                  maximum: 1
                similarity_boost:
                  type: [number, 'null']
                  minimum: 0
                  maximum: 1
                style:
                  type: [number, 'null']
                  minimum: 0
                  maximum: 1
                use_speaker_boost:
                  type: [boolean, 'null']
                seed:
                  type: [integer, 'null']
                  minimum: 0
                  maximum: 4294967295
                remove_background_noise:
                  type: [boolean, 'null']
    MediaAudioDescription:
      type: object
      additionalProperties: false
      required: [output_format, mime_type]
      properties:
        output_format:
          type: string
          minLength: 1
        mime_type:
          enum: [audio/mpeg, audio/ogg, audio/wav, application/octet-stream]
        raw_audio:
          type: object
          additionalProperties: false
          required: [encoding, sample_rate_hz, channels]
          properties:
            encoding:
              enum: [s16le, alaw, mulaw]
            sample_rate_hz:
              enum: [8000, 16000, 22050, 24000, 32000, 44100, 48000]
            channels:
              const: 1
    MediaOperationRequestBase:
      type: object
      additionalProperties: false
      required: [capability, provider, model, input, controls]
      properties:
        capability:
          type: string
          minLength: 1
        provider:
          type: string
          minLength: 1
        model:
          type: string
          minLength: 1
        input:
          type: object
        controls:
          type: object
    ImageGenerationOperationRequest:
      oneOf:
        - $ref: '#/components/schemas/SurfaceImageGenerationOperationRequest'
        - $ref: '#/components/schemas/AspectRatioImageGenerationOperationRequest'
    AspectRatioImageGenerationOperationRequest:
      allOf:
        - $ref: '#/components/schemas/MediaOperationRequestBase'
        - type: object
          properties:
            capability:
              const: image.generate
            input:
              type: object
              additionalProperties: false
              required: [prompt]
              properties:
                prompt:
                  type: string
                  minLength: 1
                  maxLength: 4000
                  pattern: '\S'
            controls:
              type: object
              additionalProperties: false
              required: [aspect_ratio, output_format, output_count]
              properties:
                aspect_ratio:
                  type: string
                  description: Use a value from the selected catalog offering.
                  minLength: 1
                output_format:
                  enum: [png, jpeg, webp]
                output_count:
                  type: integer
                  minimum: 1
                  maximum: 4
    SurfaceImageGenerationOperationRequest:
      allOf:
        - $ref: '#/components/schemas/MediaOperationRequestBase'
        - $ref: '#/components/schemas/ImageSurfaceOperationRequest'
        - type: object
          properties:
            capability:
              const: image.generate
            input:
              type: object
              additionalProperties: false
              required: [prompt]
              properties:
                previous_operation_id:
                  type: string
                  pattern: '^mop_[a-f0-9]{32}$'
                prompt:
                  type: string
                  minLength: 1
                  maxLength: 32000
                  pattern: '\S'
            controls:
              $ref: '#/components/schemas/ImageGenerationControls'
    ImageEditingOperationRequest:
      allOf:
        - $ref: '#/components/schemas/MediaOperationRequestBase'
        - $ref: '#/components/schemas/ImageSurfaceOperationRequest'
        - type: object
          properties:
            capability:
              const: image.edit
            input:
              type: object
              additionalProperties: false
              required: [prompt]
              anyOf:
                - required: [image_asset_ids]
                - required: [previous_operation_id]
              properties:
                previous_operation_id:
                  type: string
                  pattern: '^mop_[a-f0-9]{32}$'
                prompt:
                  type: string
                  minLength: 1
                  maxLength: 32000
                  pattern: '\S'
                image_asset_ids:
                  type: array
                  minItems: 1
                  maxItems: 16
                  items:
                    type: string
                    pattern: '^ast_[a-f0-9]{32}$'
                mask_asset_id:
                  type: string
                  pattern: '^ast_[a-f0-9]{32}$'
            controls:
              $ref: '#/components/schemas/ImageGenerationControls'
    ImageSurfaceOperationRequest:
      if:
        properties:
          controls:
            properties:
              surface:
                const: responses
      then:
        properties:
          input:
            not:
              required: [mask_asset_id]
      else:
        properties:
          input:
            not:
              required: [previous_operation_id]
    ImageGenerationControls:
      type: object
      description: Explicit generation choices. The selected catalog route supplies exact dimension and control limits. JPEG and WebP require compression, including explicit zero. PNG omits compression.
      additionalProperties: false
      required: [surface, quality, size, background, output_format, output_count]
      properties:
        surface:
          enum: [images, responses]
        responses_model:
          type: string
          minLength: 1
          description: Catalog-selected text model for the Responses surface.
        quality:
          enum: [low, medium, high, auto]
        size:
          type: string
          pattern: '^(auto|[1-9][0-9]*x[1-9][0-9]*)$'
        background:
          enum: [opaque, transparent, auto]
        output_format:
          enum: [png, jpeg, webp]
        output_compression:
          type: integer
          minimum: 0
          maximum: 100
        output_count:
          type: integer
          minimum: 1
          maximum: 10
        stream:
          type: boolean
          description: Request progressive output. The current Images stream has one final image.
        partial_images:
          type: integer
          minimum: 0
          maximum: 3
          description: Maximum preview count. Requires streaming when greater than zero. The provider can return fewer previews.
      allOf:
        - if:
            properties:
              surface:
                const: responses
          then:
            required: [responses_model]
            properties:
              output_count:
                const: 1
          else:
            not:
              required: [responses_model]
        - if:
            required: [stream]
            properties:
              stream:
                const: true
          then:
            properties:
              output_count:
                const: 1
          else:
            properties:
              partial_images:
                const: 0
        - if:
            properties:
              output_format:
                const: png
          then:
            not:
              required: [output_compression]
          else:
            required: [output_compression]
        - if:
            properties:
              output_format:
                const: jpeg
          then:
            properties:
              background:
                enum: [opaque, auto]
    VideoGenerationOperationRequest:
      allOf:
        - $ref: '#/components/schemas/MediaOperationRequestBase'
        - type: object
          properties:
            capability:
              const: video.generate
    DictatorTranscriptionOperationRequest:
      allOf:
        - $ref: '#/components/schemas/MediaOperationRequestBase'
        - type: object
