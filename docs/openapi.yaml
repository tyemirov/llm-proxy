          type: array
          items:
            $ref: '#/components/schemas/OpenAIResponsesTool'
        tool_choice:
          anyOf:
            - enum:
                - auto
                - none
                - required
            - type: object
              additionalProperties: false
              required:
                - type
                - name
              properties:
                type:
                  const: function
                name:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{1,64}$
        truncation:
          const: disabled
        metadata:
          type: object
          additionalProperties: false
          properties: {}
        usage:
          type: 'null'
        temperature:
          type: 'null'
        top_p:
          type: 'null'
