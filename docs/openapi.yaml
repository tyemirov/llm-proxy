      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [state, revision, reason]
              properties:
                state:
                  $ref: '#/components/schemas/HostedGrantState'
                revision:
                  type: integer
                  minimum: 1
                  maximum: 9223372036854775806
                reason:
                  $ref: '#/components/schemas/HostedGrantReason'
      responses:
        '200':
          $ref: '#/components/responses/HostedAccessGrantSuccess'
