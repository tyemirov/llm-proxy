      summary: Discover and list tenant-owned provider voices
      description: >-
        Hosted access requires an active speech grant and qualified platform credentials.
        Hosted ElevenLabs discovery exposes default premade voices.
        Hosted Dictator discovery includes only presets and the tenant's retained extracted voices.
        Hosted cursors bind the grant revision and credential version.
        Metadata reads do not create billable attempts.
      tags:
        - Proxy
      security:
        - TenantBearerKey: []
      parameters:
        - name: provider
