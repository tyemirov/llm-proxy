          minimum: 1
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        state:
          type: string
          const: available
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    AssetErrorEnvelope:
