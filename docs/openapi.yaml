            execution_kind:
              const: media_operation
      properties:
        id:
          type: string
          pattern: '^request-[a-f0-9]{32}$'
        tenant_id:
          type: string
        grant_id:
          type: string
          pattern: '^grant-[a-f0-9]{32}$'
        grant_revision:
          type: integer
          minimum: 1
        provider:
          type: string
        model:
          type: string
          minLength: 1
          description: Omitted for provider services that do not select a model.
        operation:
          type: string
        catalog_revision:
          type: string
        execution_kind:
          type: string
          enum: [text_request, media_operation, dictation_request]
        execution_id:
          type: string
          description: The identity retained by the execution owner.
        state:
          type: string
          enum: [accepted, executing, completed, failed, uncertain]
        usage_state:
          type: string
          enum: [pending, complete, unknown]
          description: Execution completion does not establish usage completeness or charge eligibility.
        failure_code:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    JournalAttempt:
      type: object
      additionalProperties: false
      required: [id, number, state, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^attempt-[a-f0-9]{32}$'
        number:
          type: integer
          minimum: 1
        state:
          type: string
          enum: [prepared, dispatched, observed, uncertain]
        dispatched_at:
          type: string
          format: date-time
        observed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    JournalQuantity:
      type: object
      additionalProperties: false
      required: [dimension, unit]
      oneOf:
        - required: [value]
        - required: [unknown_reason]
      properties:
        dimension:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
        unit:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
        value:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
