            pattern: ^[a-z][a-z0-9_-]*$
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 16384
        - name: search
          in: query
          schema:
            type: string
            maxLength: 1000
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, created_at_unix]
        - name: sort_direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: voice_type
          in: query
          description: Hosted ElevenLabs access accepts only default. Other values return 400.
          schema:
            type: string
            enum: [personal, community, default, account, non-default, non-community, saved]
        - name: category
          in: query
          description: Hosted ElevenLabs access accepts only premade. Other values return 400.
          schema:
            type: string
            enum: [premade, cloned, generated, professional]
        - name: include_total_count
          in: query
          schema:
            type: boolean
