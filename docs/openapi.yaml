    PublicCatalogControl:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - values
        - minimum
        - maximum
        - account_dependent
      properties:
        id:
          type: string
          minLength: 1
        kind:
          type: string
          enum:
            - enum
            - integer
            - number
            - boolean
            - image_size
        values:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        minimum:
          oneOf:
            - type: number
            - type: 'null'
        maximum:
          oneOf:
            - type: number
            - type: 'null'
        account_dependent:
          type: boolean
        image_size:
          $ref: '#/components/schemas/PublicImageSizeConstraints'
      allOf:
        - if:
            properties:
              kind:
                enum: [integer, number]
          then:
            properties:
              minimum:
                type: number
              maximum:
                type: number
              values:
                maxItems: 0
          else:
            properties:
              minimum:
                type: 'null'
              maximum:
                type: 'null'
        - if:
            properties:
              kind:
                const: integer
          then:
            properties:
              minimum:
                type: integer
                minimum: 0
              maximum:
                type: integer
                minimum: 0
        - if:
            properties:
              kind:
                const: image_size
          then:
            required: [image_size]
          else:
            not:
              required: [image_size]
    PublicImageSizeConstraints:
