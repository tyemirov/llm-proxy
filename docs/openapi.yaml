      type: object
      additionalProperties: false
      required:
        - id
        - object
        - created
        - model
        - choices
        - usage
      properties:
        id:
          type: string
          pattern: ^chatcmpl-
        object:
          const: chat.completion.chunk
        created:
          type: integer
          minimum: 0
        model:
          type: string
        choices:
          type: array
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required:
              - index
              - delta
              - finish_reason
              - logprobs
            properties:
              index:
                const: 0
              delta:
                type: object
                additionalProperties: false
                required: []
                properties:
                  role:
                    const: assistant
                  content:
                    type: string
                  tool_calls:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - index
                        - id
                        - type
                        - function
                      properties:
                        index:
                          type: integer
                          minimum: 0
                        id:
                          type: string
                        type:
                          const: function
                        function:
                          type: object
                          additionalProperties: false
                          required:
                            - name
                            - arguments
                          properties:
                            name:
                              type: string
                            arguments:
                              type: string
              finish_reason:
                enum:
                  - null
                  - stop
                  - tool_calls
              logprobs:
                type: 'null'
        usage:
          anyOf:
            - $ref: '#/components/schemas/OpenAIChatUsage'
            - type: 'null'
    OpenAIResponsePending:
      type: object
      additionalProperties: false
      required:
        - id
        - object
        - created_at
        - completed_at
        - status
        - model
        - output
        - error
        - incomplete_details
        - store
        - usage
      properties:
        id:
          type: string
          pattern: ^resp_
        object:
          const: response
        created_at:
          type: integer
          minimum: 0
        completed_at:
          type: 'null'
        status:
          const: in_progress
        model:
          type: string
        output:
          type: array
          maxItems: 0
