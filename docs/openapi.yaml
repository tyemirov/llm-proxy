    MessageAttachment:
      description: One provider-neutral image or audio input with a MIME type that matches its declared media type. The resolved catalog route determines support. Current Moonshot Kimi image routes accept the image variants.
      oneOf:
        - $ref: '#/components/schemas/ImageMessageAttachment'
        - $ref: '#/components/schemas/AudioMessageAttachment'
        - $ref: '#/components/schemas/ImageAssetMessageAttachment'
        - $ref: '#/components/schemas/AudioAssetMessageAttachment'
    ImageMessageAttachment:
      type: object
      additionalProperties: false
      required:
        - type
        - mime_type
        - data
        - sha256
      properties:
        type:
          type: string
          const: image
        mime_type:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
        data:
          type: string
          minLength: 4
          description: Exact nonempty media bytes encoded as canonical padded RFC 4648 base64.
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Lowercase hexadecimal SHA-256 of the decoded media bytes.
    AudioMessageAttachment:
      type: object
      additionalProperties: false
      required:
        - type
        - mime_type
        - data
        - sha256
      properties:
        type:
          type: string
          const: audio
        mime_type:
          type: string
          enum:
            - audio/m4a
            - audio/mpeg
            - audio/wav
        data:
          type: string
          minLength: 4
          description: Exact nonempty media bytes encoded as canonical padded RFC 4648 base64.
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Lowercase hexadecimal SHA-256 of the decoded media bytes.
    ImageAssetMessageAttachment:
      type: object
      additionalProperties: false
      required:
        - type
        - mime_type
        - asset_id
        - sha256
      properties:
        type:
          type: string
          const: image
        mime_type:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
        asset_id:
          type: string
          pattern: ^ast_[0-9a-f]{32}$
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
    AudioAssetMessageAttachment:
      type: object
      additionalProperties: false
      required:
        - type
        - mime_type
        - asset_id
        - sha256
      properties:
        type:
          type: string
          const: audio
        mime_type:
          type: string
          enum:
            - audio/m4a
            - audio/mpeg
            - audio/wav
        asset_id:
          type: string
          pattern: ^ast_[0-9a-f]{32}$
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
    TenantAsset:
      type: object
      additionalProperties: false
      required:
        - asset_id
        - mime_type
        - size_bytes
        - sha256
        - state
        - created_at
        - expires_at
      properties:
        asset_id:
          type: string
          pattern: ^ast_[0-9a-f]{32}$
        mime_type:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - audio/m4a
            - audio/mpeg
            - audio/wav
        size_bytes:
          type: integer
