[project]
name = "llm-proxy-client"
dynamic = ["version"]
description = "Python client for llm-proxy JSON POST text requests."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=80.0", "setuptools-scm>=9.2"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
  "mypy>=1.18.0",
  "pytest>=8.4.0",
  "pyyaml>=6.0.3",
]

[tool.setuptools]
packages = ["llm_proxy_client"]

[tool.setuptools_scm]
root = ".."
version_scheme = "no-guess-dev"
tag_regex = '^v(?P<version>1\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))$'

[tool.setuptools_scm.scm.git]
describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v1.*"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
strict = true
packages = ["llm_proxy_client"]
