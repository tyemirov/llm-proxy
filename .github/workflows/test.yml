name: Test

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - '**/*.go'
      - 'python/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - 'playwright.blackbox.config.js'
      - 'scripts/**'
      - 'tools/gitrelease/**'
      - 'site/**'
      - 'tests/**'
      - '.github/workflows/test.yml'
      - '.github/workflows/release.yml'
      - 'Dockerfile'

env:
  GO_VERSION: '1.25.12'
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: llm_proxy_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname llm_proxy_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    env:
      LLM_PROXY_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres dbname=llm_proxy_test sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Install uv
        run: python -m pip install uv
      - name: Install Go lint tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/gordonklaus/ineffassign@latest
      - name: Run CI
        run: timeout -k 350s -s SIGKILL 350s make ci
