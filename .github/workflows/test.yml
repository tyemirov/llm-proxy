name: Test

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - '**/*.go'
      - 'python/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - 'playwright.blackbox.config.js'
      - 'scripts/**'
      - '.mprlab/deploy/resources.yml'
      - 'docker/pages/Dockerfile'
      - 'site/**'
      - 'tests/**'
      - '.github/workflows/test.yml'
      - 'Dockerfile'

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: python -m pip install uv
      - name: Install Go lint tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/gordonklaus/ineffassign@latest
      - name: Run CI
        run: make ci PLAYWRIGHT_INSTALL_FLAGS=
