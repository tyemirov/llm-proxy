name: Test

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - '**/*.go'
      - 'python/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - 'playwright.blackbox.config.js'
      - 'scripts/**'
      - '.mprlab/deploy/resources.yml'
      - 'docker/pages/Dockerfile'
      - 'site/**'
      - 'tests/**'
      - '.github/workflows/test.yml'
      - 'Dockerfile'

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: python -m pip install uv
      - name: Run backend qualification
        run: make ci-backend PLAYWRIGHT_INSTALL_FLAGS=

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Run frontend qualification
        run: make ci-frontend PLAYWRIGHT_INSTALL_FLAGS=

  test:
    needs: [backend, frontend]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require both qualification jobs
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
