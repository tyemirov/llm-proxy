---
mprlab_resources:
  schema_version: 2
  owner: llm-proxy
  dependencies: []
  resources:
    - kind: compose_project
      id: runtime
      placement: gateway
      profiles: []
      retired_services:
        - project: mprlab-nginx-gateway
          service: llm-proxy
      images:
        - id: llm-proxy-image
          repository: ghcr.io/tyemirov/llm-proxy
          visibility: public
          build:
            context: .
            dockerfile: Dockerfile
            platforms:
              - linux/amd64
              - linux/arm64
      services:
        - id: llm-proxy
          image: llm-proxy-image
          environment_files:
            - secret: llm-proxy.runtime-environment
          assets:
            - source: configs/config.yml
              target: /app/config.yml
              mode: "0444"
          mounts:
            - volume: data
              target: /app/data
              read_only: false
          ports:
            - container_port: 8080
          readiness:
            protocol: http
            port: 8080
            path: /config-ui.yaml
            expected_status: 200
      volumes:
        - id: data
          name: mprlab-nginx-gateway_llm-proxy-data
          retention: retain
    - kind: runtime_capability
      id: http
      name: llm-proxy.http
      version: 1
      project: runtime
      service: llm-proxy
      endpoint:
        scope: same_host
        scheme: http
        alias: llm-proxy
        port: 8080
      health:
        protocol: http
        path: /config-ui.yaml
        expected_status: 200
    - kind: caddy_route
      id: public-api
      hostname: llm-proxy-api.mprlab.com
      listener: https
      handlers:
        - id: default
          path_prefix: /
          upstream: llm-proxy.http
          transport:
            protocol: http
            dial_timeout_seconds: 10
            response_header_timeout_seconds: 3660
            read_timeout_seconds: 3660
      tls:
        mode: automatic
      access:
        trusted_networks:
          - 127.0.0.1/32
          - 172.19.0.0/16
          - 192.168.1.158/32
        rate_limit:
          events: 10
          window_seconds: 10
    - kind: health_check
      id: api-auth-boundary
      protocol: http
      url: https://llm-proxy-api.mprlab.com/
      expected_status: 403
    - kind: health_check
      id: management-config
      protocol: http
      url: https://llm-proxy-api.mprlab.com/config-ui.yaml
      expected_status: 200
    - kind: github_pages
      id: website
      repository: tyemirov/llm-proxy
      branch: gh-pages
      domain: llm-proxy.mprlab.com
      url: https://llm-proxy.mprlab.com/
      source:
        kind: container
        context: .
        dockerfile: docker/pages/Dockerfile
        target: pages
      verification:
        path: /.mprlab-release.json
    - kind: tauth_tenant
      id: authentication
      capability: tauth.tenants
      version: 1
      tenant:
        id: llm-proxy
        display_name: LLM Proxy
        origins:
          - https://llm-proxy.mprlab.com
        google_web_client_id:
          secret: llm-proxy.google-web-client-id
        jwt_signing_key:
          secret: llm-proxy.jwt-signing-key
        cookie:
          domain: .mprlab.com
          session_name: app_session_llm_proxy
          refresh_name: app_refresh_llm_proxy
