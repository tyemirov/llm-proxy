---
mprlab_resources:
  owner: llm-proxy
  release:
    scheme: semver
  resources:
    - kind: private_values
      id: private
      bindings:
        admin-emails: LLM_PROXY_MANAGEMENT_ADMIN_EMAILS
        google-web-client-id: LLM_PROXY_MANAGEMENT_GOOGLE_CLIENT_ID
        jwt-signing-key: LLM_PROXY_MANAGEMENT_JWT_SIGNING_KEY
        provider-key-encryption-key: LLM_PROXY_MANAGEMENT_PROVIDER_KEY_ENCRYPTION_KEY
    - kind: compose_project
      id: runtime
      retired_services:
        - project: mprlab-nginx-gateway
          service: llm-proxy
      images:
        - id: llm-proxy-image
          repository: ghcr.io/tyemirov/llm-proxy
          build:
            context: .
            dockerfile: Dockerfile
            platforms:
              - linux/amd64
              - linux/arm64
      services:
        - id: llm-proxy
          image: llm-proxy-image
          placement:
            group: gateway
            cardinality: one
          environment:
            LLM_PROXY_MANAGEMENT_ADMIN_EMAILS:
              resource: private
              output: admin-emails
            LLM_PROXY_MANAGEMENT_API_ORIGIN:
              resource: public-api
              output: origin
            LLM_PROXY_MANAGEMENT_DATABASE_PATH:
              value: /data/llm-proxy-management.sqlite
            LLM_PROXY_MANAGEMENT_GOOGLE_CLIENT_ID:
              resource: authentication
              output: google-web-client-id
            LLM_PROXY_MANAGEMENT_JWT_ISSUER:
              value: tauth
            LLM_PROXY_MANAGEMENT_JWT_SIGNING_KEY:
              resource: authentication
              output: jwt-signing-key
            LLM_PROXY_MANAGEMENT_LOCALHOST_ORIGIN:
              value: http://localhost:4179
            LLM_PROXY_MANAGEMENT_LOOPBACK_ORIGIN:
              value: http://127.0.0.1:4179
            LLM_PROXY_MANAGEMENT_PROVIDER_KEY_ENCRYPTION_KEY:
              resource: private
              output: provider-key-encryption-key
            LLM_PROXY_MANAGEMENT_PROXY_ORIGIN:
              resource: public-api
              output: origin
            LLM_PROXY_MANAGEMENT_PUBLIC_ORIGIN:
              resource: website
              output: origin
            LLM_PROXY_MANAGEMENT_SESSION_COOKIE_NAME:
              resource: authentication
              output: session-cookie-name
            LLM_PROXY_MANAGEMENT_TAUTH_LOGIN_PATH:
              value: /auth/google
            LLM_PROXY_MANAGEMENT_TAUTH_LOGOUT_PATH:
              value: /auth/logout
            LLM_PROXY_MANAGEMENT_TAUTH_NONCE_PATH:
              value: /auth/nonce
            LLM_PROXY_MANAGEMENT_TAUTH_SESSION_PATH:
              value: /auth/session
            LLM_PROXY_MANAGEMENT_TAUTH_TENANT_ID:
              resource: authentication
              output: tenant-id
            LLM_PROXY_MANAGEMENT_TAUTH_URL:
              value: https://tauth-api.mprlab.com
            LLM_PROXY_MANAGEMENT_UI_DESCRIPTION:
              value: LLM Proxy
          assets:
            - source: configs/config.yml
              target: /app/config.yml
              mode: "0444"
            - source: configs/providers.yml
              target: /app/providers.yml
              mode: "0444"
          mounts:
            - volume: data
              target: /data
              read_only: false
          ports:
            - container_port: 8080
          readiness:
            protocol: http
            port: 8080
            path: /config-ui.yaml
            expected_status: 200
      volumes:
        - id: data
          name: mprlab-nginx-gateway_llm-proxy-data
          retention: retain
    - kind: runtime_capability
      id: http
      name: llm-proxy.http
      version: 1
      project: runtime
      service: llm-proxy
      endpoint:
        scope: same_host
        scheme: http
        alias: llm-proxy
        port: 8080
      health:
        protocol: http
        path: /config-ui.yaml
        expected_status: 200
    - kind: caddy_route
      id: public-api
      hostname: llm-proxy-api.mprlab.com
      listener: https
      handlers:
        - id: default
          path_prefix: /
          upstream: llm-proxy.http
          transport:
            protocol: http
            dial_timeout_seconds: 10
            response_header_timeout_seconds: 3660
            read_timeout_seconds: 3660
      tls:
        mode: automatic
      access:
        trusted_networks:
          - 127.0.0.1/32
          - 172.19.0.0/16
          - 192.168.1.158/32
        rate_limit:
          events: 10
          window_seconds: 10
    - kind: health_check
      id: api-auth-boundary
      protocol: http
      url: https://llm-proxy-api.mprlab.com/
      expected_status: 403
    - kind: health_check
      id: management-config
      protocol: http
      url: https://llm-proxy-api.mprlab.com/config-ui.yaml
      expected_status: 200
    - kind: github_pages
      id: website
      repository: tyemirov/llm-proxy
      branch: gh-pages
      domain: llm-proxy.mprlab.com
      url: https://llm-proxy.mprlab.com/
      source:
        kind: container
        context: .
        dockerfile: docker/pages/Dockerfile
        target: pages
      verification:
        path: /.mprlab-release.json
    - kind: tauth_tenant
      id: authentication
      capability: tauth.tenants
      version: 1
      tenant:
        id: llm-proxy
        display_name: LLM Proxy
        origins:
          - https://llm-proxy.mprlab.com
        google_web_client_id:
          resource: private
          output: google-web-client-id
        jwt_signing_key:
          resource: private
          output: jwt-signing-key
        cookie:
          domain: .mprlab.com
          session_name: app_session_llm_proxy
          refresh_name: app_refresh_llm_proxy
        oauth:
          access_token_ttl: 5m
          refresh_token_ttl: 720h
          consent_ttl: 720h
          allow_client_metadata_documents: true
          resources:
            - identifier: https://llm-proxy-api.mprlab.com
              display_name: LLM Proxy API
              scopes:
                - identifier: llm-proxy:use
                  display_name: Use LLM Proxy
                  description: Use the LLM Proxy API.
          clients: []
