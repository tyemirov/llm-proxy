---
mprlab_resources:
  schema_version: 1
  repo:
    id: llm-proxy
    directory: llm-proxy
  resources:
    - type: make_workflow
      name: llm-proxy
      targets:
        release: release
        publish: publish
        deploy: deploy
    - type: tauth_tenant
      name: llm-proxy-authentication
      config_destination: configs/config.tauth.yml
      environment_destination: configs/.env.tauth
      container_name: tauth-api
      tenant:
        id: llm-proxy
        display_name: LLM Proxy
        tenant_origins:
          - https://llm-proxy.mprlab.com
        google_web_client_id: "${TAUTH_GOOGLE_WEB_CLIENT_ID_LLM_PROXY}"
        jwt_signing_key: "${TAUTH_JWT_SIGNING_KEY_LLM_PROXY}"
        cookie_domain: .mprlab.com
        session_cookie_name: app_session_llm_proxy
        refresh_cookie_name: app_refresh_llm_proxy
        session_ttl: "${TAUTH_SESSION_TTL}"
        refresh_ttl: "${TAUTH_REFRESH_TTL}"
        nonce_ttl: "${TAUTH_NONCE_TTL}"
        allow_insecure_http: "${TAUTH_ALLOW_INSECURE_HTTP}"
    - type: container_service
      name: llm-proxy
      image: ghcr.io/tyemirov/llm-proxy:latest
      ports:
        - container_port: 8080
      container_name: llm-proxy
      compose_template: .mprlab/deploy/ansible/templates/docker-compose.yml.j2
      compose_project: mprlab-nginx-gateway
      remote_directory: apps/llm-proxy
      network: mprlab-nginx-gateway_default
      data_volume: mprlab-nginx-gateway_llm-proxy-data
      runtime_assets:
        - path: .mprlab/deploy/.env
          example_path: configs/.env.sample
          destination: runtime/.env
          mode: "0600"
        - path: configs/config.yml
          destination: runtime/config.yml
    - type: caddy_route
      name: llm-proxy-api
      host: llm-proxy-api.mprlab.com
      upstream: llm-proxy:8080
      config_template: .mprlab/deploy/ansible/templates/caddy-route.caddy.j2
      config_destination: caddy/sites/llm-proxy.caddy
      container_name: caddy2
      container_config_path: /etc/caddy/Caddyfile
      trusted_networks:
        - 172.19.0.0/16
        - 127.0.0.1/32
        - 192.168.1.158/32
      rate_limit:
        zone: llm
        events: 10
        window: 10s
      transport:
        dial_timeout: 10s
        response_header_timeout: 3660s
        read_timeout: 3660s
    - type: health_check
      name: llm-proxy-api
      path: /
      url: https://llm-proxy-api.mprlab.com/
      status_codes:
        - 403
    - type: health_check
      name: llm-proxy-management-config
      path: /config-ui.yaml
      url: https://llm-proxy-api.mprlab.com/config-ui.yaml
      status_codes:
        - 200
    - type: github_pages
      name: llm-proxy
      target: pages-deploy
      url: https://llm-proxy.mprlab.com/
      source_marker_path: /.mprlab-release.json
