---
mprlab_resources:
  schema_version: 1
  repo:
    id: llm-proxy
    directory: llm-proxy
    dispatch_target: llm-proxy
  resources:
    - type: make_workflow
      name: llm-proxy
      targets:
        release: release
        publish: publish
        deploy: deploy
    - type: tauth_tenant
      name: llm-proxy-authentication
      tenant:
        id: llm-proxy
        display_name: LLM Proxy
        tenant_origins:
          - https://llm-proxy.mprlab.com
        google_web_client_id: "${TAUTH_GOOGLE_WEB_CLIENT_ID_LLM_PROXY}"
        jwt_signing_key: "${TAUTH_JWT_SIGNING_KEY_LLM_PROXY}"
        cookie_domain: .mprlab.com
        session_cookie_name: app_session_llm_proxy
        refresh_cookie_name: app_refresh_llm_proxy
        session_ttl: "${TAUTH_SESSION_TTL}"
        refresh_ttl: "${TAUTH_REFRESH_TTL}"
        nonce_ttl: "${TAUTH_NONCE_TTL}"
        allow_insecure_http: "${TAUTH_ALLOW_INSECURE_HTTP}"
    - type: container_service
      name: llm-proxy
      host_group: gateway
      image_variable: MPRLAB_LLM_PROXY_IMAGE_REF
      ports:
        - container_port: 8080
      compose_file: docker-compose.yml
      compose_project: mprlab-nginx-gateway
      runtime_assets:
        - path: .mprlab/deploy/.env
          example_path: configs/.env.sample
          destination: configs/.env.llm-proxy
          mode: "0600"
        - path: configs/config.yml
          destination: configs/config.llm-proxy.yml
    - type: caddy_route
      name: llm-proxy-api
      host: llm-proxy-api.mprlab.com
      upstream: llm-proxy:8080
      snippet: llm-proxy.caddy
    - type: health_check
      name: llm-proxy-api
      path: /
      url: https://llm-proxy-api.mprlab.com/
      status_codes:
        - 403
    - type: github_pages
      name: llm-proxy
      target: pages-deploy
      url: https://llm-proxy.mprlab.com/
      source_marker_path: /.mprlab-release.json
    - type: ansible_task_bundle
      name: production
      host_group: gateway
      timeout_seconds: 1200
      entrypoints:
        validate: .mprlab/deploy/ansible/tasks/validate.yml
        preflight: .mprlab/deploy/ansible/tasks/preflight.yml
        deploy: .mprlab/deploy/ansible/tasks/deploy.yml
        verify: .mprlab/deploy/ansible/tasks/verify.yml
