mprlab_resources:
    artifacts:
        container_images:
            - build:
                context: .
                dockerfile: Dockerfile
                platforms:
                    - linux/amd64
                    - linux/arm64
              id: llm-proxy-image
        web_bundles:
            - format: directory
              id: website
              source:
                context: .
                dockerfile: docker/pages/Dockerfile
                kind: container
                target: pages
    environment:
        private_inputs:
            - id: deploy-sudo-password-tutosh
              variable: DEPLOY_SUDO_PASSWORD_TUTOSH
            - id: llm-proxy-management-admin-emails
              variable: LLM_PROXY_MANAGEMENT_ADMIN_EMAILS
            - id: llm-proxy-management-google-client-id
              variable: LLM_PROXY_MANAGEMENT_GOOGLE_CLIENT_ID
            - id: llm-proxy-management-jwt-signing-key
              variable: LLM_PROXY_MANAGEMENT_JWT_SIGNING_KEY
            - id: llm-proxy-management-provider-key-encryption-key
              variable: LLM_PROXY_MANAGEMENT_PROVIDER_KEY_ENCRYPTION_KEY
            - id: mprlab-tauth-management-url
              variable: MPRLAB_TAUTH_MANAGEMENT_URL
            - id: mprlab-tauth-provisioning-credentials
              variable: MPRLAB_TAUTH_PROVISIONING_CREDENTIALS
        source: .mprlab/deploy/.env
    lifecycle:
        ci:
            command:
                - make
                - ci
            enabled: true
        defaults:
            timeouts:
                completion: 30m
                readiness: 30s
                request: 15s
                shutdown: 5s
                startup: 30s
        observations:
            http:
                - expected_status: 200
                  id: api-health
                  protocol: http
                  url: https://llm-proxy-api.mprlab.com/healthz
                - expected_status: 200
                  id: website-health
                  protocol: http
                  url: https://llm-proxy.mprlab.com/healthz
        operations:
            - name: app-deploy
              polling:
                attempt_limit: 360
                increment: 0s
                initial: 1s
                maximum: 5s
                multiplier: 2
            - name: app-publish
              polling:
                attempt_limit: 360
                increment: 0s
                initial: 1s
                maximum: 5s
                multiplier: 2
            - name: app-release
              polling:
                attempt_limit: 360
                increment: 0s
                initial: 1s
                maximum: 5s
                multiplier: 2
            - name: app_lifecycle.repository_read
              polling:
                attempt_limit: 360
                increment: 0s
                initial: 1s
                maximum: 5s
                multiplier: 2
        private_inputs:
            operations: []
    owner: llm-proxy
    publications:
        ghcr:
            images:
                - artifact: llm-proxy-image
                  id: llm-proxy-image
                  repository: ghcr.io/tyemirov/llm-proxy
        github_pages:
            sites:
                - artifact: website
                  branch: gh-pages
                  domain: llm-proxy.mprlab.com
                  id: website
                  marker:
                    path: /.mprlab-release.json
                  repository: tyemirov/llm-proxy
    release:
        fixed_major: 1
        scheme: semver
    targets:
        access:
            hosts:
                - elevation_password:
                    input: deploy-sudo-password-tutosh
                  host: tutosh
        docker_compose:
            projects:
                - id: runtime
                  retired_services:
                    - project: mprlab-nginx-gateway
                      service: llm-proxy
                  services:
                    - assets:
                        - mode: "0444"
                          source: configs/config.yml
                          target: /app/config.yml
                        - mode: "0444"
                          source: configs/providers.yml
                          target: /app/providers.yml
                      endpoints:
                        - endpoint:
                            alias: llm-proxy
                            port: 8080
                            scheme: http
                            scope: same_host
                          health:
                            expected_status: 200
                            path: /healthz
                            protocol: http
                          id: http
                          name: llm-proxy.http
                          version: 1
                        - endpoint:
                            port: 18083
                            scheme: http
                            scope: private_lan
                          health:
                            expected_status: 200
                            path: /healthz
                            protocol: http
                          id: http-private-lan
                          name: llm-proxy.http.private-lan
                          version: 1
                        - endpoint:
                            alias: runtime-llm-proxy-readiness
                            port: 8080
                            scheme: http
                            scope: same_host
                          health:
                            expected_status: 200
                            path: /healthz
                            protocol: http
                          id: readiness
                          name: llm-proxy.readiness.runtime.llm-proxy
                          version: 1
                      environment:
                        - input: llm-proxy-management-admin-emails
                          name: LLM_PROXY_MANAGEMENT_ADMIN_EMAILS
                        - name: LLM_PROXY_MANAGEMENT_API_ORIGIN
                          value: https://llm-proxy-api.mprlab.com
                        - name: LLM_PROXY_MANAGEMENT_DATABASE_PATH
                          value: /data/llm-proxy-management.sqlite
                        - input: llm-proxy-management-google-client-id
                          name: LLM_PROXY_MANAGEMENT_GOOGLE_CLIENT_ID
                        - name: LLM_PROXY_MANAGEMENT_JWT_ISSUER
                          value: tauth
                        - input: llm-proxy-management-jwt-signing-key
                          name: LLM_PROXY_MANAGEMENT_JWT_SIGNING_KEY
                        - name: LLM_PROXY_MANAGEMENT_LOCALHOST_ORIGIN
                          value: http://localhost:4179
                        - name: LLM_PROXY_MANAGEMENT_LOOPBACK_ORIGIN
                          value: http://127.0.0.1:4179
                        - input: llm-proxy-management-provider-key-encryption-key
                          name: LLM_PROXY_MANAGEMENT_PROVIDER_KEY_ENCRYPTION_KEY
                        - name: LLM_PROXY_MANAGEMENT_PROXY_ORIGIN
                          value: https://llm-proxy-api.mprlab.com
                        - name: LLM_PROXY_MANAGEMENT_PUBLIC_ORIGIN
                          output: origin
                          target: website
                        - name: LLM_PROXY_MANAGEMENT_SESSION_COOKIE_NAME
                          value: app_session_llm_proxy
                        - name: LLM_PROXY_MANAGEMENT_TAUTH_LOGIN_PATH
                          value: /auth/google
                        - name: LLM_PROXY_MANAGEMENT_TAUTH_LOGOUT_PATH
                          value: /auth/logout
                        - name: LLM_PROXY_MANAGEMENT_TAUTH_NONCE_PATH
                          value: /auth/nonce
                        - name: LLM_PROXY_MANAGEMENT_TAUTH_SESSION_PATH
                          value: /auth/session
                        - name: LLM_PROXY_MANAGEMENT_TAUTH_TENANT_ID
                          value: llm-proxy
                        - name: LLM_PROXY_MANAGEMENT_TAUTH_URL
                          value: https://tauth-api.mprlab.com
                        - name: LLM_PROXY_MANAGEMENT_UI_DESCRIPTION
                          value: LLM Proxy
                      id: llm-proxy
                      image:
                        publication: llm-proxy-image
                      mounts:
                        - read_only: false
                          target: /data
                          volume: data
                      placement:
                        cardinality: one
                        group: gateway
                      ports:
                        - container_port: 8080
                          host_port: 18083
                          scope: private_lan
                      readiness:
                        endpoint: readiness
                  volumes:
                    - id: data
                      name: mprlab-nginx-gateway_llm-proxy-data
                      retention: retain
        github_pages:
            sites:
                - id: website
                  publication: website
                  url: https://llm-proxy.mprlab.com/
        ingress:
            caddy:
                routes:
                    - access:
                        rate_limit:
                            events: 120
                            window_seconds: 60
                        trusted_networks:
                            - 127.0.0.1/32
                            - 172.19.0.0/16
                            - 192.168.1.158/32
                      handlers:
                        - access:
                            browser:
                                allow_credentials: true
                                allowed_origins:
                                    - https://llm-proxy.mprlab.com
                          id: default
                          path_prefix: /
                          transport:
                            dial_timeout_seconds: 10
                            protocol: http
                            read_timeout_seconds: 3660
                            response_header_timeout_seconds: 3660
                          upstream: llm-proxy.http
                      hostname: llm-proxy-api.mprlab.com
                      id: public-api
                      listener: https
                      tls:
                        mode: automatic
