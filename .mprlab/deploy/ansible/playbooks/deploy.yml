---
- name: Admit the exact published LLM Proxy release
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  vars_files:
    - ../../resources.yml
  vars:
    mprlab_repo_root: "{{ (playbook_dir ~ '/../../../..') | realpath }}"
    mprlab_deploy_mode_input: "{{ lookup('ansible.builtin.env', 'MPRLAB_DEPLOY_MODE') | trim }}"
    mprlab_publish_remote: "{{ lookup('ansible.builtin.env', 'LLM_PROXY_DEPLOY_PUBLISH_REMOTE') | trim }}"
    mprlab_publish_branch: "{{ lookup('ansible.builtin.env', 'LLM_PROXY_DEPLOY_PUBLISH_BRANCH') | trim }}"
    mprlab_pages_branch: "{{ lookup('ansible.builtin.env', 'LLM_PROXY_DEPLOY_PAGES_BRANCH') | trim }}"
    mprlab_pages_url: "{{ lookup('ansible.builtin.env', 'LLM_PROXY_DEPLOY_PAGES_URL') | trim }}"
  tasks:
    - name: Validate the repository-owned deployment transaction
      ansible.builtin.include_tasks: ../tasks/local-preflight.yml

- name: Converge the declared LLM Proxy resources
  hosts: gateway
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars_files:
    - ../../resources.yml
  vars:
    mprlab_deploy_mode: "{{ hostvars['localhost'].mprlab_deploy_mode }}"
    mprlab_deploy_image_ref: "{{ hostvars['localhost'].mprlab_deploy_image_ref }}"
    mprlab_repo_root: "{{ hostvars['localhost'].mprlab_repo_root_effective }}"
    mprlab_container_resource: >-
      {{
        mprlab_resources.resources
        | selectattr('type', 'equalto', 'container_service')
        | list
        | first
      }}
    mprlab_caddy_resource: >-
      {{
        mprlab_resources.resources
        | selectattr('type', 'equalto', 'caddy_route')
        | list
        | first
      }}
    mprlab_tauth_resource: >-
      {{
        mprlab_resources.resources
        | selectattr('type', 'equalto', 'tauth_tenant')
        | list
        | first
      }}
    mprlab_health_resources: >-
      {{
        mprlab_resources.resources
        | selectattr('type', 'equalto', 'health_check')
        | list
      }}
    mprlab_remote_app_root: >-
      {{ mprlab_runtime_root }}/{{ mprlab_container_resource.remote_directory }}
  tasks:
    - name: Validate the target runtime contract
      ansible.builtin.include_tasks: ../tasks/remote-preflight.yml
      when: mprlab_deploy_mode == 'deploy'

    - name: Reconcile the declared TAuth tenant
      ansible.builtin.include_tasks: ../tasks/reconcile-tauth.yml
      when: mprlab_deploy_mode == 'deploy'

    - name: Reconcile the declared Caddy route
      ansible.builtin.include_tasks: ../tasks/reconcile-caddy.yml
      when: mprlab_deploy_mode == 'deploy'

    - name: Converge the LLM Proxy service
      ansible.builtin.include_tasks: ../tasks/reconcile-service.yml
      when: mprlab_deploy_mode == 'deploy'

    - name: Verify the converged deployment
      ansible.builtin.include_tasks: ../tasks/verify.yml
      when: mprlab_deploy_mode == 'deploy'

- name: Activate the exact published Pages artifact
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  vars:
    mprlab_deploy_mode: "{{ hostvars['localhost'].mprlab_deploy_mode }}"
    mprlab_release_version: "{{ hostvars['localhost'].mprlab_release_version }}"
    mprlab_repo_root: "{{ hostvars['localhost'].mprlab_repo_root_effective }}"
    mprlab_publish_remote: "{{ hostvars['localhost'].mprlab_publish_remote_effective }}"
    mprlab_pages_branch: "{{ hostvars['localhost'].mprlab_pages_branch_effective }}"
    mprlab_pages_url: "{{ hostvars['localhost'].mprlab_pages_url_effective }}"
    mprlab_pages_resource: "{{ hostvars['localhost'].mprlab_pages_resource }}"
  tasks:
    - name: Activate and verify the published Pages resource
      ansible.builtin.command:
        argv:
          - make
          - --no-print-directory
          - "{{ mprlab_pages_resource.target }}"
      args:
        chdir: "{{ mprlab_repo_root }}"
      environment:
        PUBLISH_REMOTE: "{{ mprlab_publish_remote }}"
        PAGES_BRANCH: "{{ mprlab_pages_branch }}"
        PAGES_URL: "{{ mprlab_pages_url }}"
        PAGES_VERSION: "{{ mprlab_release_version }}"
      changed_when: true
      when: mprlab_deploy_mode == 'deploy'

    - name: Report the completed repository-owned transaction
      ansible.builtin.debug:
        msg: >-
          llm-proxy deploy complete version={{ mprlab_release_version }}
          image={{ hostvars['localhost'].mprlab_deploy_image_ref }}
      when: mprlab_deploy_mode == 'deploy'
