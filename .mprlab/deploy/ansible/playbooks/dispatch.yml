---
- name: Run one LLM Proxy app-owned deployment phase
  hosts: gateway
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    mprlab_app_resource_repo_path: "{{ lookup('ansible.builtin.env', 'LLM_PROXY_DEPLOY_REPO_ROOT') }}"
    mprlab_app_resource_source_repo_path: "{{ lookup('ansible.builtin.env', 'LLM_PROXY_DEPLOY_REPO_ROOT') }}"
    llm_proxy_deploy_phase: "{{ lookup('ansible.builtin.env', 'LLM_PROXY_DEPLOY_PHASE') | trim }}"
  tasks:
    - name: Require one canonical app-owned deployment phase
      ansible.builtin.assert:
        quiet: true
        that:
          - llm_proxy_deploy_phase in ['preflight', 'deploy', 'verify']
        fail_msg: "LLM_PROXY_DEPLOY_PHASE must be preflight, deploy, or verify."

    - name: Run the selected app-owned deployment phase
      ansible.builtin.include_tasks: "../tasks/{{ llm_proxy_deploy_phase }}.yml"
