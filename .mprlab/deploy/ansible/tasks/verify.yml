---
- name: Inspect the deployed LLM Proxy backend
  ansible.builtin.command:
    argv:
      - "{{ mprlab_docker_cli }}"
      - inspect
      - "{{ mprlab_container_resource.container_name }}"
  register: mprlab_backend_inspect
  changed_when: false

- name: Resolve the deployed backend state
  ansible.builtin.set_fact:
    mprlab_backend_state: "{{ mprlab_backend_inspect.stdout | from_json | first }}"

- name: Require the exact running backend and network
  ansible.builtin.assert:
    quiet: true
    that:
      - mprlab_backend_state.State.Running
      - mprlab_backend_state.Config.Image == mprlab_deploy_image_ref
      - mprlab_container_resource.network in mprlab_backend_state.NetworkSettings.Networks
    fail_msg: "LLM Proxy must run the exact admitted image on its declared network."

- name: Require every declared public HTTP boundary
  delegate_to: localhost
  become: false
  ansible.builtin.uri:
    url: "{{ item.url }}"
    method: GET
    follow_redirects: none
    status_code: "{{ item.status_codes }}"
    timeout: 10
  loop: "{{ mprlab_health_resources }}"
  loop_control:
    label: "{{ item.name }}"
  register: mprlab_public_boundaries
  retries: 12
  delay: 5
  until: mprlab_public_boundaries is succeeded
