---
- name: Stage the declared LLM Proxy runtime assets
  ansible.builtin.copy:
    src: "{{ mprlab_repo_root }}/{{ item.path }}"
    dest: "{{ mprlab_remote_app_root }}/{{ item.destination }}"
    mode: "{{ item.mode | default('0644') }}"
  loop: "{{ mprlab_container_resource.runtime_assets }}"
  loop_control:
    label: "{{ item.destination }}"

- name: Render the exact production Compose resource
  ansible.builtin.template:
    src: "{{ mprlab_repo_root }}/{{ mprlab_container_resource.compose_template }}"
    dest: "{{ mprlab_remote_app_root }}/docker-compose.yml"
    mode: "0644"

- name: Inspect the immutable image locally on the target
  ansible.builtin.command:
    argv:
      - "{{ mprlab_docker_cli }}"
      - image
      - inspect
      - "{{ mprlab_deploy_image_ref }}"
  register: mprlab_target_image
  failed_when: false
  changed_when: false

- name: Pull the immutable image only when it is absent
  ansible.builtin.command:
    argv:
      - "{{ mprlab_docker_cli }}"
      - pull
      - "{{ mprlab_deploy_image_ref }}"
  when: mprlab_target_image.rc != 0
  changed_when: true

- name: Converge the exact LLM Proxy Compose service
  ansible.builtin.command:
    argv:
      - "{{ mprlab_docker_cli }}"
      - compose
      - --project-name
      - "{{ mprlab_container_resource.compose_project }}"
      - --project-directory
      - "{{ mprlab_remote_app_root }}"
      - --file
      - "{{ mprlab_remote_app_root }}/docker-compose.yml"
      - up
      - --detach
      - --no-deps
      - "{{ mprlab_container_resource.name }}"
  register: mprlab_compose_convergence
  changed_when: >-
    'Created' in (mprlab_compose_convergence.stdout ~ mprlab_compose_convergence.stderr)
    or 'Recreated' in (mprlab_compose_convergence.stdout ~ mprlab_compose_convergence.stderr)
    or 'Started' in (mprlab_compose_convergence.stdout ~ mprlab_compose_convergence.stderr)
