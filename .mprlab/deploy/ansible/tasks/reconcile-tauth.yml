---
- name: Load the active TAuth configuration
  ansible.builtin.slurp:
    src: "{{ mprlab_runtime_root }}/{{ mprlab_tauth_resource.config_destination }}"
  register: mprlab_active_tauth_config

- name: Decode the active TAuth configuration
  ansible.builtin.set_fact:
    mprlab_tauth_document: "{{ mprlab_active_tauth_config.content | b64decode | from_yaml }}"

- name: Resolve the owned and unowned TAuth tenants
  ansible.builtin.set_fact:
    mprlab_owned_tauth_tenants: >-
      {{
        mprlab_tauth_document.tenants
        | selectattr('id', 'equalto', mprlab_tauth_resource.tenant.id)
        | list
      }}
    mprlab_other_tauth_tenants: >-
      {{
        mprlab_tauth_document.tenants
        | rejectattr('id', 'equalto', mprlab_tauth_resource.tenant.id)
        | list
      }}

- name: Require an unambiguous TAuth tenant contribution
  ansible.builtin.assert:
    quiet: true
    that:
      - mprlab_tauth_document.server is mapping
      - mprlab_tauth_document.tenants is sequence
      - mprlab_owned_tauth_tenants | length <= 1
      - >-
        (
          mprlab_other_tauth_tenants
          | map(attribute='tenant_origins')
          | flatten
          | intersect(mprlab_tauth_resource.tenant.tenant_origins)
          | length
        ) == 0
      - >-
        mprlab_tauth_resource.tenant.session_cookie_name
        not in
        (mprlab_other_tauth_tenants | map(attribute='session_cookie_name') | list)
      - >-
        mprlab_tauth_resource.tenant.refresh_cookie_name
        not in
        (mprlab_other_tauth_tenants | map(attribute='refresh_cookie_name') | list)
    fail_msg: "The declared TAuth tenant conflicts with an existing tenant."

- name: Resolve the prior origins owned by LLM Proxy
  ansible.builtin.set_fact:
    mprlab_prior_owned_tauth_origins: >-
      {{
        (
          (mprlab_owned_tauth_tenants | first).tenant_origins
          | default([])
        )
        if (mprlab_owned_tauth_tenants | length == 1)
        else []
      }}

- name: Render the complete deterministic TAuth document
  ansible.builtin.set_fact:
    mprlab_desired_tauth_document: >-
      {{
        mprlab_tauth_document
        | combine(
            {
              'server': mprlab_tauth_document.server
                | combine(
                    {
                      'cors_allowed_origins':
                        (
                          (
                            mprlab_tauth_document.server.cors_allowed_origins
                            | default([])
                            | difference(mprlab_prior_owned_tauth_origins)
                          )
                          + mprlab_tauth_resource.tenant.tenant_origins
                        )
                        | unique
                        | sort
                    },
                    recursive=True
                  ),
              'tenants':
                (
                  mprlab_other_tauth_tenants
                  + [mprlab_tauth_resource.tenant]
                )
                | sort(attribute='id')
            },
            recursive=True
          )
      }}

- name: Write the candidate TAuth configuration
  ansible.builtin.copy:
    content: "{{ mprlab_desired_tauth_document | to_nice_yaml(indent=2, sort_keys=false) }}"
    dest: "{{ mprlab_remote_app_root }}/tauth-config.candidate.yml"
    mode: "0600"

- name: Resolve the running TAuth image
  ansible.builtin.command:
    argv:
      - "{{ mprlab_docker_cli }}"
      - inspect
      - --format
      - "{{ '{{.Config.Image}}' }}"
      - "{{ mprlab_tauth_resource.container_name }}"
  register: mprlab_tauth_image
  changed_when: false

- name: Validate the candidate through the exact TAuth image
  ansible.builtin.command:
    argv:
      - "{{ mprlab_docker_cli }}"
      - run
      - --rm
      - --network
      - none
      - --env-file
      - "{{ mprlab_runtime_root }}/{{ mprlab_tauth_resource.environment_destination }}"
      - --env
      - TAUTH_DATABASE_URL=
      - --volume
      - "{{ mprlab_remote_app_root }}/tauth-config.candidate.yml:/config/config.yml:ro"
      - "{{ mprlab_tauth_image.stdout }}"
      - preflight
      - --config=/config/config.yml
  changed_when: false

- name: Activate the validated TAuth configuration
  ansible.builtin.copy:
    src: "{{ mprlab_remote_app_root }}/tauth-config.candidate.yml"
    dest: "{{ mprlab_runtime_root }}/{{ mprlab_tauth_resource.config_destination }}"
    remote_src: true
    mode: "0644"
  register: mprlab_tauth_config_activation

- name: Remove the candidate TAuth configuration
  ansible.builtin.file:
    path: "{{ mprlab_remote_app_root }}/tauth-config.candidate.yml"
    state: absent

- name: Restart TAuth only when its exact configuration changed
  ansible.builtin.command:
    argv:
      - "{{ mprlab_docker_cli }}"
      - restart
      - "{{ mprlab_tauth_resource.container_name }}"
  when: mprlab_tauth_config_activation.changed
  changed_when: true

- name: Wait for the restarted TAuth container state
  ansible.builtin.command:
    argv:
      - "{{ mprlab_docker_cli }}"
      - inspect
      - --format
      - "{{ '{{.State.Running}}' }}"
      - "{{ mprlab_tauth_resource.container_name }}"
  register: mprlab_tauth_running
  changed_when: false
  retries: 12
  delay: 2
  until: mprlab_tauth_running.stdout == 'true'
  when: mprlab_tauth_config_activation.changed
