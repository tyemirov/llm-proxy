---
- name: Load the immutable LLM Proxy deployment image contract
  ansible.builtin.include_tasks: resolve-image.yml

- name: Require the LLM Proxy gateway inventory contract
  ansible.builtin.assert:
    quiet: true
    that:
      - mprlab_remote_project_root is match('^/\\S+$')
      - llm_proxy_docker_cli is match('^/\\S+$')
      - llm_proxy_compose_project_name == 'mprlab-nginx-gateway'
      - llm_proxy_gateway_network == 'mprlab-nginx-gateway_default'
    fail_msg: "Gateway inventory must declare the canonical project root, Docker CLI, Compose project, and network."

- name: Require the production Docker engine
  ansible.builtin.command:
    argv:
      - "{{ llm_proxy_docker_cli }}"
      - version
  changed_when: false
