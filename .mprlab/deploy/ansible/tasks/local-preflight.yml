---
- name: Require one canonical deployment mode
  ansible.builtin.assert:
    quiet: true
    that:
      - mprlab_deploy_mode_input in ['dry-run', 'deploy']
      - mprlab_publish_remote | length > 0
      - mprlab_publish_branch == 'master'
      - mprlab_pages_branch == 'gh-pages'
      - mprlab_pages_url == 'https://llm-proxy.mprlab.com/'
    fail_msg: "The repository-owned deployment inputs are not canonical."

- name: Resolve the declared resource sets
  ansible.builtin.set_fact:
    mprlab_workflow_resources: >-
      {{ mprlab_resources.resources | selectattr('type', 'equalto', 'make_workflow') | list }}
    mprlab_container_resources: >-
      {{ mprlab_resources.resources | selectattr('type', 'equalto', 'container_service') | list }}
    mprlab_caddy_resources: >-
      {{ mprlab_resources.resources | selectattr('type', 'equalto', 'caddy_route') | list }}
    mprlab_tauth_resources: >-
      {{ mprlab_resources.resources | selectattr('type', 'equalto', 'tauth_tenant') | list }}
    mprlab_health_resources: >-
      {{ mprlab_resources.resources | selectattr('type', 'equalto', 'health_check') | list }}
    mprlab_pages_resources: >-
      {{ mprlab_resources.resources | selectattr('type', 'equalto', 'github_pages') | list }}

- name: Require exactly one current resource of every supported kind
  ansible.builtin.assert:
    quiet: true
    that:
      - mprlab_resources.schema_version == 1
      - mprlab_resources.repo.id == 'llm-proxy'
      - mprlab_resources.repo.directory == 'llm-proxy'
      - mprlab_resources.resources | length == 7
      - mprlab_workflow_resources | length == 1
      - mprlab_container_resources | length == 1
      - mprlab_caddy_resources | length == 1
      - mprlab_tauth_resources | length == 1
      - mprlab_health_resources | length == 2
      - mprlab_pages_resources | length == 1
    fail_msg: "resources.yml must declare the complete singular LLM Proxy deployment."

- name: Require the complete current resource contract
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        (mprlab_workflow_resources | first).targets
        ==
        {'release': 'release', 'publish': 'publish', 'deploy': 'deploy'}
      - (mprlab_container_resources | first).image == 'ghcr.io/tyemirov/llm-proxy:latest'
      - (mprlab_container_resources | first).runtime_assets | length == 2
      - (mprlab_pages_resources | first).target == 'pages-deploy'
      - (mprlab_pages_resources | first).url == mprlab_pages_url
    fail_msg: "resources.yml contains an incomplete or noncanonical resource."

- name: Resolve the immutable local deployment inputs
  ansible.builtin.set_fact:
    mprlab_deploy_mode: "{{ mprlab_deploy_mode_input }}"
    mprlab_repo_root_effective: "{{ mprlab_repo_root }}"
    mprlab_container_resource: "{{ mprlab_container_resources | first }}"
    mprlab_pages_resource: "{{ mprlab_pages_resources | first }}"
    mprlab_release_helper: "{{ mprlab_repo_root }}/tools/gitrelease/scripts/release_helper.py"
    mprlab_manifest_digest_helper: >-
      {{ mprlab_repo_root }}/tools/gitrelease/scripts/resolve_container_manifest_digest.sh
    mprlab_inventory_path: >-
      {{ mprlab_repo_root }}/.mprlab/deploy/ansible/inventory/hosts.yml
    mprlab_publish_remote_effective: "{{ mprlab_publish_remote }}"
    mprlab_pages_branch_effective: "{{ mprlab_pages_branch }}"
    mprlab_pages_url_effective: "{{ mprlab_pages_url }}"

- name: Inspect the canonical local deployment inputs
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
  loop:
    - name: resource manifest
      path: "{{ mprlab_repo_root }}/.mprlab/deploy/resources.yml"
      private: false
    - name: operator inventory
      path: "{{ mprlab_inventory_path }}"
      private: true
    - name: runtime environment
      path: "{{ mprlab_repo_root }}/{{ mprlab_container_resource.runtime_assets[0].path }}"
      private: true
    - name: runtime configuration
      path: "{{ mprlab_repo_root }}/{{ mprlab_container_resource.runtime_assets[1].path }}"
      private: false
    - name: release helper
      path: "{{ mprlab_release_helper }}"
      private: false
    - name: image digest helper
      path: "{{ mprlab_manifest_digest_helper }}"
      private: false
  loop_control:
    label: "{{ item.name }}"
  register: mprlab_local_deployment_inputs

- name: Require regular private and tracked deployment inputs
  ansible.builtin.assert:
    quiet: true
    that:
      - item.stat.exists
      - item.stat.isreg
      - not item.stat.islnk
      - not item.item.private or item.stat.mode == '0600'
    fail_msg: "Invalid local deployment input {{ item.item.name }}."
  loop: "{{ mprlab_local_deployment_inputs.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Read the sealed local release identity
  ansible.builtin.command:
    argv:
      - python3
      - "{{ mprlab_release_helper }}"
      - local-release-state
      - --default-branch
      - "{{ mprlab_publish_branch }}"
    chdir: "{{ mprlab_repo_root }}"
  register: mprlab_local_release_state
  changed_when: false

- name: Decode the sealed local release identity
  ansible.builtin.set_fact:
    mprlab_local_release: "{{ mprlab_local_release_state.stdout | from_json }}"

- name: Require the exact sealed release
  ansible.builtin.assert:
    quiet: true
    that:
      - mprlab_local_release.ok is sameas true
      - mprlab_local_release.state == 'sealed'
      - mprlab_local_release.version is match('^v[0-9]+[.][0-9]+[.][0-9]+$')
      - mprlab_local_release.release_commit is match('^[0-9a-f]{40}$')
    fail_msg: "make deploy requires the exact sealed release created by make release."

- name: Resolve the local Git release state
  ansible.builtin.command:
    argv: "{{ item.argv }}"
    chdir: "{{ mprlab_repo_root }}"
  loop:
    - name: head
      argv: [git, rev-parse, HEAD]
    - name: branch
      argv: [git, branch, --show-current]
    - name: status
      argv: [git, status, --porcelain=v1, --untracked-files=normal]
    - name: tags
      argv: [git, tag, --points-at, HEAD, --list, "v*", --sort=-version:refname]
  loop_control:
    label: "{{ item.name }}"
  register: mprlab_local_git_state
  changed_when: false

- name: Require clean master at the sealed release commit and tag
  ansible.builtin.assert:
    quiet: true
    that:
      - mprlab_local_git_state.results[0].stdout == mprlab_local_release.release_commit
      - mprlab_local_git_state.results[1].stdout == mprlab_publish_branch
      - mprlab_local_git_state.results[2].stdout == ''
      - mprlab_local_git_state.results[3].stdout_lines | first == mprlab_local_release.version
    fail_msg: "Deployment requires clean master at the exact sealed release commit and tag."

- name: Require the canonical annotated release tag
  ansible.builtin.command:
    argv:
      - git
      - cat-file
      - -t
      - "{{ mprlab_local_release.version }}"
    chdir: "{{ mprlab_repo_root }}"
  register: mprlab_release_tag_type
  changed_when: false

- name: Require an annotated release tag
  ansible.builtin.assert:
    quiet: true
    that:
      - mprlab_release_tag_type.stdout == 'tag'
    fail_msg: "The sealed release tag must be annotated."

- name: Refresh the exact published branch and tags
  ansible.builtin.command:
    argv:
      - git
      - fetch
      - "{{ mprlab_publish_remote }}"
      - "{{ mprlab_publish_branch }}"
      - --tags
      - --prune
    chdir: "{{ mprlab_repo_root }}"
  changed_when: false

- name: Resolve the published branch commit
  ansible.builtin.command:
    argv:
      - git
      - rev-parse
      - "{{ mprlab_publish_remote }}/{{ mprlab_publish_branch }}"
    chdir: "{{ mprlab_repo_root }}"
  register: mprlab_published_branch_commit
  changed_when: false

- name: Require the exact published release commit
  ansible.builtin.assert:
    quiet: true
    that:
      - mprlab_published_branch_commit.stdout == mprlab_local_release.release_commit
    fail_msg: "Run make publish before make deploy."

- name: Resolve the release image digest
  ansible.builtin.command:
    argv:
      - "{{ mprlab_manifest_digest_helper }}"
      - "{{ mprlab_container_resource.image | regex_replace(':latest$', ':' ~ mprlab_local_release.version) }}"
    chdir: "{{ mprlab_repo_root }}"
  register: mprlab_release_image_digest
  changed_when: false

- name: Resolve the latest image digest
  ansible.builtin.command:
    argv:
      - "{{ mprlab_manifest_digest_helper }}"
      - "{{ mprlab_container_resource.image }}"
    chdir: "{{ mprlab_repo_root }}"
  register: mprlab_latest_image_digest
  changed_when: false

- name: Require one exact published image identity
  ansible.builtin.assert:
    quiet: true
    that:
      - mprlab_release_image_digest.stdout is match('^sha256:[0-9a-f]{64}$')
      - mprlab_latest_image_digest.stdout == mprlab_release_image_digest.stdout
    fail_msg: "The published latest image must equal the sealed release image."

- name: Seal the admitted deployment identity
  ansible.builtin.set_fact:
    mprlab_release_version: "{{ mprlab_local_release.version }}"
    mprlab_deploy_image_ref: >-
      {{
        mprlab_container_resource.image
        | regex_replace(':latest$', '@' ~ mprlab_release_image_digest.stdout)
      }}

- name: Verify the published Pages artifact before remote mutation
  ansible.builtin.command:
    argv:
      - make
      - --no-print-directory
      - "{{ mprlab_pages_resource.target }}"
    chdir: "{{ mprlab_repo_root }}"
  environment:
    PUBLISH_REMOTE: "{{ mprlab_publish_remote }}"
    PAGES_BRANCH: "{{ mprlab_pages_branch }}"
    PAGES_URL: "{{ mprlab_pages_url }}"
    PAGES_VERSION: "{{ mprlab_release_version }}"
    DEPLOY_PAGES_ARGS: --verify-only
  changed_when: false
  when: mprlab_deploy_mode == 'deploy'

- name: Report the admitted dry-run identity
  ansible.builtin.debug:
    msg: >-
      llm-proxy deploy dry-run complete version={{ mprlab_release_version }}
      image={{ mprlab_deploy_image_ref }} production_state_changed=false
  when: mprlab_deploy_mode == 'dry-run'
