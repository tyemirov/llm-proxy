---
- name: Load the immutable LLM Proxy deployment image contract
  ansible.builtin.include_tasks: resolve-image.yml

- name: Inspect app-owned deployment inputs
  ansible.builtin.stat:
    path: "{{ llm_proxy_input.path }}"
    follow: false
  loop:
    - name: runtime config
      path: "{{ mprlab_app_resource_repo_path }}/configs/config.yml"
      private: false
    - name: runtime environment
      path: "{{ mprlab_app_resource_source_repo_path }}/.mprlab/deploy/.env"
      private: true
  loop_control:
    loop_var: llm_proxy_input
    label: "{{ llm_proxy_input.name }}"
  register: llm_proxy_deploy_input_stats

- name: Require canonical deployment inputs
  ansible.builtin.assert:
    quiet: true
    that:
      - llm_proxy_input_stat.stat.exists
      - llm_proxy_input_stat.stat.isreg
      - not llm_proxy_input_stat.stat.islnk
      - not llm_proxy_input_stat.llm_proxy_input.private or llm_proxy_input_stat.stat.mode == '0600'
    fail_msg: >-
      Invalid LLM Proxy deployment input {{ llm_proxy_input_stat.llm_proxy_input.name }}. Tracked
      assets must be regular files and the runtime env must be a private 0600 regular file.
  loop: "{{ llm_proxy_deploy_input_stats.results }}"
  loop_control:
    loop_var: llm_proxy_input_stat
    label: "{{ llm_proxy_input_stat.llm_proxy_input.name }}"
