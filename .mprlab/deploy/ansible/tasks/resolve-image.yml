---
- name: Resolve the immutable LLM Proxy deployment image
  ansible.builtin.set_fact:
    llm_proxy_deploy_image_ref_effective: "{{ lookup('ansible.builtin.env', 'MPRLAB_LLM_PROXY_IMAGE_REF') | trim }}"

- name: Require the canonical immutable LLM Proxy deployment image
  ansible.builtin.assert:
    quiet: true
    that:
      - llm_proxy_deploy_image_ref_effective is match('^ghcr[.]io/tyemirov/llm-proxy@sha256:[0-9a-f]{64}$')
    fail_msg: "MPRLAB_LLM_PROXY_IMAGE_REF must be the canonical immutable LLM Proxy GHCR digest."
