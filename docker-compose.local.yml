services:
  frontend:
    image: ghcr.io/tyemirov/ghttp:latest
    pull_policy: always
    depends_on:
      api:
        condition: service_started
      tauth:
        condition: service_started
    env_file:
      - ./configs/.env.frontend.local
    environment:
      GHTTP_SERVE_PROXIES: "/config-ui.yaml=http://api:8080,/auth=http://tauth:8080,/me=http://tauth:8080"
      GHTTP_SERVE_RESPONSE_HEADERS: "/=Cache-Control:no-store"
    ports:
      - "127.0.0.1:4179:4179"
    volumes:
      - ./site:/app/site:ro

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-proxy-local:latest
    command:
      - /usr/local/bin/llm-proxy
      - --config
      - /app/configs/config.yml
    env_file:
      - ./configs/.env.api.local
    environment:
      LLM_PROXY_MANAGEMENT_TAUTH_URL: "http://localhost:4179"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./configs/config.yml:/app/configs/config.yml:ro
      - llm_proxy_local_data:/data

  tauth:
    image: ghcr.io/tyemirov/tauth:latest
    pull_policy: always
    env_file:
      - ./configs/.env.tauth.local
    volumes:
      - ./configs/tauth.local.yml:/config/tauth.local.yml:ro
      - tauth_local_data:/data

volumes:
  llm_proxy_local_data:
  tauth_local_data:
