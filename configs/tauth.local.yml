server:
  listen_addr: "${TAUTH_LISTEN_ADDR}"
  database_url: "${TAUTH_DATABASE_URL}"
  enable_cors: "${TAUTH_ENABLE_CORS}"
  cors_allowed_origins:
    - "${LLM_PROXY_MANAGEMENT_PUBLIC_ORIGIN}"
    - "${TAUTH_CORS_EXCEPTION_1}"
  cors_allowed_origin_exceptions:
    - "${TAUTH_CORS_EXCEPTION_1}"
  enable_tenant_header_override: true

oauth:
  enabled: true
  allow_insecure_http: true
  issuer: "${LLM_PROXY_MANAGEMENT_PUBLIC_ORIGIN}"
  authorization_endpoint: "${LLM_PROXY_MANAGEMENT_PUBLIC_ORIGIN}/oauth/authorize"
  token_endpoint: "${LLM_PROXY_MANAGEMENT_PUBLIC_ORIGIN}/oauth/token"
  revocation_endpoint: "${LLM_PROXY_MANAGEMENT_PUBLIC_ORIGIN}/oauth/revoke"
  jwks_uri: "${LLM_PROXY_MANAGEMENT_PUBLIC_ORIGIN}/oauth/jwks"
  login_endpoint: "${LLM_PROXY_MANAGEMENT_PUBLIC_ORIGIN}/oauth/login"
  consent_endpoint: "${LLM_PROXY_MANAGEMENT_PUBLIC_ORIGIN}/oauth/consent"
  authorization_request_ttl: "5m"
  authorization_code_ttl: "1m"
  active_signing_key_id: "local-mcp"
  signing_keys:
    - id: "local-mcp"
      private_key_base64: "${TAUTH_OAUTH_ES256_PRIVATE_KEY_BASE64}"
  client_metadata:
    request_timeout: "3s"
    maximum_bytes: 5120
    minimum_cache_ttl: "1m"
    maximum_cache_ttl: "1h"

tenants:
  - id: "${LLM_PROXY_MANAGEMENT_TAUTH_TENANT_ID}"
    display_name: "LLM Proxy local"
    oauth:
      enabled: true
      access_token_ttl: "5m"
      refresh_token_ttl: "720h"
      consent_ttl: "720h"
      allow_client_metadata_documents: true
      resources:
        - identifier: "${LLM_PROXY_MANAGEMENT_PROXY_ORIGIN}"
          display_name: "LLM Proxy API"
          scopes:
            - identifier: "llm-proxy:use"
              display_name: "Use LLM Proxy"
              description: "Use owned tenants."
      clients: []
    tenant_origins:
      - "${LLM_PROXY_MANAGEMENT_PUBLIC_ORIGIN}"
    google_web_client_id: "${LLM_PROXY_MANAGEMENT_GOOGLE_CLIENT_ID}"
    jwt_signing_key: "${LLM_PROXY_MANAGEMENT_JWT_SIGNING_KEY}"
    cookie_domain: ""
    session_cookie_name: "${LLM_PROXY_MANAGEMENT_SESSION_COOKIE_NAME}"
    refresh_cookie_name: "${LLM_PROXY_LOCAL_TAUTH_REFRESH_COOKIE_NAME}"
    session_ttl: "30m"
    refresh_ttl: "720h"
    nonce_ttl: "10m"
    allow_insecure_http: "${TAUTH_ALLOW_INSECURE_HTTP}"
