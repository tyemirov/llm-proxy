providers:
    - id: openai
      label: OpenAI
      api_service_label: OpenAI API
      key_acquisition_url: https://platform.openai.com/api-keys
      fields:
        - id: api_key
          label: OpenAI API key
          kind: credential
          type: opaque
          required: true
          default: ""
          secret: true
          validation:
            minimum_length: 1
          environment: OPENAI_API_KEY
      transports:
        - id: text
          endpoint:
            method: POST
            default_base_url: https://api.openai.com/v1
            path: /responses
          authentication:
            kind: bearer
            field: api_key
            header: Authorization
            prefix: 'Bearer '
          request_protocol: openai_responses
          response_protocol: openai_responses
          usage_mapping: openai_responses
          lifecycle: pollable_resource
          resource_visibility:
            retry_interval_milliseconds: 2000
            retry_limit: 1
            retry_status_codes:
                - 403
                - 404
          protocol_parameters:
            media_execution_lifecycle: pollable_resource
            model_field: model
            token_field: max_output_tokens
            output_fields:
                - output[].content[].text
            finish_rules:
                complete:
                    - completed
                continue:
                    - incomplete:max_output_tokens
            continuation_rules:
                - append_visible_assistant_output
                - request_missing_suffix
            error_rules:
                - cancelled
                - failed
                - refusal
                - unknown_status
            usage_fields:
                input: usage.input_tokens
                output: usage.output_tokens
                total: usage.total_tokens
        - id: dictation
          endpoint:
            method: POST
            default_base_url: https://api.openai.com/v1
            path: /audio/transcriptions
          authentication:
            kind: bearer
            field: api_key
            header: Authorization
            prefix: 'Bearer '
          request_protocol: multipart_transcription
          response_protocol: multipart_transcription
          usage_mapping: multipart_transcription
          lifecycle: synchronous_completion
          protocol_parameters:
            model_field: model
            token_field: ""
            output_fields:
                - text
            finish_rules:
                complete:
                    - http_2xx
                continue: []
            continuation_rules: []
            error_rules:
                - malformed_response
                - provider_error
            usage_fields:
                input: ""
                output: ""
                total: ""
      offerings:
        - model: gpt-4o-mini
          upstream_model: gpt-4o-mini
          transport: text
          operations:
            - text
          request_profile: openai_responses_temperature
          media_inputs:
            - image
          media_limits:
            - id: inline_request_bytes
              media_type: all
              transport: inline
              status: bounded
              value: 512000000
              unit: bytes
              scope: request_encoded_bytes
              source: https://developers.openai.com/api/docs/guides/images-vision
              last_verified: "2026-08-11"
            - id: image_count
              media_type: image
              transport: any
              status: bounded
              value: 1500
              unit: files
              scope: request
              source: https://developers.openai.com/api/docs/guides/images-vision
              last_verified: "2026-08-11"
            - id: image_inline_bytes
              media_type: image
              transport: inline
              status: unknown
              unit: bytes
              scope: attachment
              source: https://developers.openai.com/api/docs/guides/images-vision
              last_verified: "2026-08-11"
          prices:
            - operation: text
              available: false
              source: https://developers.openai.com/api/docs/pricing
              last_verified: "2026-08-10"
              unavailable_reason: Exact published pricing has not been imported for this provider offering.
