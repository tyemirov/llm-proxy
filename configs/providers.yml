    - id: meta
      label: Meta
      api_service_label: Meta API
      key_acquisition_url: https://dev.meta.ai/
      fields:
        - id: api_key
          label: Meta API key
          kind: credential
          type: opaque
          required: true
          default: ""
          secret: true
          validation:
            minimum_length: 1
          environment: MODEL_API_KEY
      transports:
        - id: text
          endpoint:
            method: POST
            default_base_url: https://api.meta.ai/v1
            path: /chat/completions
          authentication:
            kind: bearer
            field: api_key
            header: Authorization
            prefix: 'Bearer '
          request_protocol: openai_chat_completions
          response_protocol: openai_chat_completions
          usage_mapping: openai_chat_completions
          lifecycle: synchronous_completion
          protocol_parameters:
            media_execution_lifecycle: synchronous_completion
            model_field: model
            token_field: max_completion_tokens
            output_fields:
                - choices[].message.content
            finish_rules:
                complete:
                    - stop
                continue:
                    - length
            continuation_rules:
                - append_visible_assistant_output
                - request_missing_suffix
            error_rules:
                - content_filter
                - tool_calls
                - unknown_finish_reason
            usage_fields:
                input: usage.prompt_tokens
                output: usage.completion_tokens
                total: usage.total_tokens
      offerings:
        - model: muse-spark-1.1
          upstream_model: muse-spark-1.1
          transport: text
          operations:
            - text
          default_operations:
            - text
