server:
  port: 8080
  log_level: info
  upstream_capacity:
    global: {active: 32, admitted: 512}
    tenant: {active: 8, admitted: 32}
    account: {active: 8, admitted: 32}
    media: {active: 24, admitted: 256}
    status: {active: 8, admitted: 128}
    transfer: {active: 8, admitted: 128}
    interactive_reserve: 1
    origins:
      - {origin: https://api.openai.com, active: 4, queued: 24}
      - {origin: https://api.deepseek.com, active: 4, queued: 24}
      - {origin: https://api.moonshot.ai, active: 4, queued: 24}
      - {origin: https://api.minimax.io, active: 4, queued: 24}
      - {origin: https://api.siliconflow.com, active: 4, queued: 24}
      - {origin: https://api.z.ai, active: 4, queued: 24}
      - {origin: https://generativelanguage.googleapis.com, active: 4, queued: 24}
      - {origin: https://api.anthropic.com, active: 4, queued: 24}
      - {origin: https://api.meta.ai, active: 4, queued: 24}
      - {origin: https://api.x.ai, active: 4, queued: 24}
      - {origin: https://api.baiduqianfan.ai, active: 4, queued: 24}
      - {origin: https://aiplatform.googleapis.com, active: 4, queued: 24}
  request_timeout_seconds: 360
  max_request_timeout_seconds: 3600
  max_prompt_bytes: 4194304
  max_asset_bytes: 2000000000
  asset_retention_seconds: 172800
  media_operation_workers: 2
  dictator_media_operation_workers: 1
  media_operation_capacity: 32
  tenant_media_operation_capacity: 4
  media_operation_lifetime_seconds: 900
  media_operation_claim_seconds: 60
  media_operation_claim_renewal_seconds: 20
  asset_store_path: /data/assets
  max_input_audio_bytes: 26214400
  upstream_rate_limits: []
management:
  public_origin: "${LLM_PROXY_MANAGEMENT_PUBLIC_ORIGIN}"
  ui_description: "${LLM_PROXY_MANAGEMENT_UI_DESCRIPTION}"
  ui_origins:
  - "${LLM_PROXY_MANAGEMENT_PUBLIC_ORIGIN}"
  - "${LLM_PROXY_MANAGEMENT_LOOPBACK_ORIGIN}"
  - "${LLM_PROXY_MANAGEMENT_LOCALHOST_ORIGIN}"
  admin_emails: ${LLM_PROXY_MANAGEMENT_ADMIN_EMAILS}
  tauth_url: "${LLM_PROXY_MANAGEMENT_TAUTH_URL}"
  tauth_tenant_id: "${LLM_PROXY_MANAGEMENT_TAUTH_TENANT_ID}"
  google_client_id: "${LLM_PROXY_MANAGEMENT_GOOGLE_CLIENT_ID}"
  login_path: "${LLM_PROXY_MANAGEMENT_TAUTH_LOGIN_PATH}"
  logout_path: "${LLM_PROXY_MANAGEMENT_TAUTH_LOGOUT_PATH}"
  nonce_path: "${LLM_PROXY_MANAGEMENT_TAUTH_NONCE_PATH}"
  session_path: "${LLM_PROXY_MANAGEMENT_TAUTH_SESSION_PATH}"
  jwt_signing_key: "${LLM_PROXY_MANAGEMENT_JWT_SIGNING_KEY}"
  jwt_issuer: "${LLM_PROXY_MANAGEMENT_JWT_ISSUER}"
  session_cookie_name: "${LLM_PROXY_MANAGEMENT_SESSION_COOKIE_NAME}"
  database_path: "${LLM_PROXY_MANAGEMENT_DATABASE_PATH}"
  usage_queue_size: 1024
  provider_key_encryption_key: "${LLM_PROXY_MANAGEMENT_PROVIDER_KEY_ENCRYPTION_KEY}"
  management_api_origin: "${LLM_PROXY_MANAGEMENT_API_ORIGIN}"
  proxy_origin: "${LLM_PROXY_MANAGEMENT_PROXY_ORIGIN}"
